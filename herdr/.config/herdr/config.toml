onboarding = false

[update]
channel = "stable"

[keys]
rename_tab = "prefix+,"
next_tab = "ctrl+j"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
host_cursor = "drawn"
prompt_new_tab_name = false
pane_borders = "always"
pane_outer_borders = false
pane_gaps = false
tab_bar_position = "bottom"

[ui.toast]
delivery = "herdr"

# Windows client owns sound. Herdr also runs a remote-client-bridge inside WSL,
# which is a second client, so enabling sound here fires every notification
# twice. Windows has this on.
[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false

[terminal]
default_shell = "/usr/bin/fish"

[remote]
manage_ssh_config = true

[experimental]
pane_history = false
