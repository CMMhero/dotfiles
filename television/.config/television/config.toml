# television reads this file and only the keys it knows. Only what this dotfiles
# repo actually wants is set; everything else stays on television's own defaults.
#
# This is deliberately a short file rather than a copy of the 7.5KB config
# television generates on first run. That file is almost entirely commented-out
# documentation of every available key, it is version-specific, and stowing it
# would mean a television upgrade rewrites a tracked file.
#
# The one thing worth setting is the tldr channel trigger: pressing television's
# trigger key while running `tldr` opens the page picker rather than the default
# channel. The channel it opens is upstream's own tldr channel, which
# `tv update-channels` fetches and which tealdeer's `tldr` satisfies -- it calls
# `tldr --list` and previews with `tldr <page> --color always`, both of which
# tealdeer 1.9.0 supports.
#
# Nothing in cable/ is tracked. That directory is machine state -- television
# rewrites it on every `tv update-channels` -- and upstream now ships a tldr
# channel of its own, so a hand-written one here would only shadow it.

[shell_integration.channel_triggers]
"tldr" = ["tldr"]