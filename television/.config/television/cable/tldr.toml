[metadata]
name = "tldr"
description = "Browse tldr cheatsheets from the tealdeer cache"

[source]
# Page names, e.g. "tar", "git-commit". tldr-pages keeps pages in per-platform
# subdirs (common/, linux/, ...) and the same page can exist in several, so
# `-printf '%f'` then sort -u collapses them to one entry per name.
#
# %f is GNU find; this dotfiles setup targets Linux only (see install.sh, which
# bails on non-apt systems).
command = "find \"$HOME/.cache/tealdeer/tldr-pages\" -type f -name '*.md' -printf '%f\\n' 2>/dev/null | sed 's/\\.md$//' | sort -u"
output = "{line}"

[preview]
# Map the selected name back to its file(s). find rather than a glob because the
# pages are nested in platform subdirs and the name has no fixed depth.
command = "find \"$HOME/.cache/tealdeer/tldr-pages\" -type f -name '{split:=:0}.md' -exec cat {} + 2>/dev/null"

[ui.preview_panel]
size = 40