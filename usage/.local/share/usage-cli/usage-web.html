function drawModelBars() {
  const M = state.mod, [, , val, fmt] = MODEL_METRICS.find((m) => m[0] === M.metric);
  const all = modelRows();
  let rows = M.picked.size ? all.filter((r) => M.picked.has(r.key)) : all;
  rows = rows.map((r) => [r, val(r)]).filter((x) => x[1] != null && Number.isFinite(x[1])).sort((a, b) => b[1] - a[1]).slice(0, 14);
  const max = Math.max(...rows.map((x) => x[1]), 0) || 1;
  // Elo sits in a narrow band far from zero, so those bars start at a floor.
  const floor = M.metric.startsWith("arena") && rows.length ? Math.min(...rows.map((x) => x[1])) - 60 : 0;
  $("mbars").innerHTML = rows.length ? `<div class="hbars">${rows.map(([r, v]) => `<div class="hbar ${r.u ? "used" : ""}"><span class="n">${vi(r.vendor, 14)}<b title="${esc(r.name)}">${esc(r.name.replace(/^[^/]+\//, ""))}</b></span><span class="tr"><i style="width:${Math.max(1.5, ((v - floor) / (max - floor || 1)) * 100)}%"></i></span><span class="v">${fmt(v)}</span></div>`).join("")}</div>`
    : `<div class="empty">No model in this list has that figure.</div>`;
}

function drawModelScatter() {
  const el = $("mscatter"), M = state.mod, d = M.data;
  const usedIds = new Set(d.used.map((u) => u.catalogId).filter(Boolean));
  const pickedIds = new Set(modelRows().filter((r) => M.picked.has(r.key) && r.c).map((r) => r.c.id));
  const pts = d.catalog.filter((c) => c.bench?.intelligence != null && c.price?.output > 0);
  if (!pts.length) { el.innerHTML = `<div class="empty">No benchmark data cached.</div>`; return; }
  const W = Math.max(420, el.clientWidth), H = 280, L = 40, R = 12, T = 10, B = 30, pw = W - L - R, ph = H - T - B;
  const xs = pts.map((c) => Math.log10(c.price.output)), x0 = Math.floor(Math.min(...xs)), x1 = Math.ceil(Math.max(...xs));
  const ys = pts.map((c) => c.bench.intelligence), y0 = Math.floor(Math.min(...ys) / 10) * 10, y1 = Math.ceil(Math.max(...ys) / 10) * 10;
  const X = (c) => L + ((Math.log10(c.price.output) - x0) / (x1 - x0 || 1)) * pw, Y = (c) => T + ph - ((c.bench.intelligence - y0) / (y1 - y0 || 1)) * ph;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Intelligence index against output price"><g class="axis">`;
  for (let e = x0; e <= x1; e++) { const xx = L + ((e - x0) / (x1 - x0 || 1)) * pw; svg += `<line class="gridline" x1="${xx}" x2="${xx}" y1="${T}" y2="${T + ph}"/><text x="${xx}" y="${H - 12}" text-anchor="middle">$${e < 0 ? (10 ** e).toFixed(-e) : 10 ** e}</text>`; }
  for (let v = y0; v <= y1; v += 10) { const yy = T + ph - ((v - y0) / (y1 - y0 || 1)) * ph; svg += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end">${v}</text>`; }
  svg += `<text x="${W - R}" y="${H - 1}" text-anchor="end">output $ per 1M tokens, log scale</text></g>`;
  const rank = (c) => (pickedIds.has(c.id) ? 2 : usedIds.has(c.id) ? 1 : 0);
  for (const c of pts.slice().sort((a, b) => rank(a) - rank(b))) {
    const k = rank(c);
    svg += `<circle data-id="${esc(c.id)}" cx="${X(c)}" cy="${Y(c)}" r="${k ? 5 : 3}" fill="${k === 2 ? "var(--c4)" : k ? "var(--accent)" : "var(--faint)"}" opacity="${k ? 1 : 0.55}" stroke="var(--bg)" stroke-width="1"/>`;
    if (k) svg += `<text x="${X(c) + 8}" y="${Y(c) + 3}" style="fill:var(--text);font-size:10.5px;font-family:var(--sans)" text-anchor="${X(c) > W - 150 ? "end" : "start"}" ${X(c) > W - 150 ? `dx="-16"` : ""}>${esc(c.id.replace(/^[^/]+\//, ""))}</text>`;
  }
  el.innerHTML = svg + "</svg>";
  const byId = new Map(pts.map((c) => [c.id, c]));
  el.onpointermove = (ev) => {
    const c = byId.get(ev.target.dataset?.id);
    if (!c) return hideTip();
    showTip(`<div class="t">${esc(c.name)}</div><div class="r"><span>Intelligence</span><b class="mono">${c.bench.intelligence.toFixed(1)}</b></div><div class="r"><span>Output</span><b class="mono">$${c.price.output.toFixed(2)}</b></div><div class="r"><span>Input</span><b class="mono">$${(c.price.input ?? 0).toFixed(2)}</b></div><div class="r"><span>Context</span><b class="mono">${c.context ? compact(c.context) : "-"}</b></div>`, ev);
  };
  el.onpointerleave = hideTip;
}

function drawModelTable() {
  const M = state.mod, card = $("mtable");
  if (!card) return;
  const cols = [
    ["name", "Model", (r) => r.name, true],
    ["in", "Input", (r) => r.c?.price?.input], ["out", "Output", (r) => r.c?.price?.output], ["cr", "Cache read", (r) => r.c?.price?.cacheRead],
    ["ctx", "Context", (r) => r.c?.context], ["max", "Max out", (r) => r.c?.maxOutput],
    ["int", "Intelligence", (r) => r.c?.bench?.intelligence], ["cod", "Coding", (r) => r.c?.bench?.coding], ["agt", "Agentic", (r) => r.c?.bench?.agentic], ["elo", "Code Elo", (r) => r.c?.bench?.arenaCode],
    ["tok", "Your tokens", (r) => r.u?.tokens], ["cost", "Your cost", (r) => r.u?.cost],
  ];
  const [sk, sd] = M.sort ?? ["tok", -1];
  const col = cols.find((c) => c[0] === sk) ?? cols[0];
  const rows = modelRows().sort((a, b) => {
    const x = col[2](a), y = col[2](b);
    if (x == null && y == null) return (b.u?.tokens ?? 0) - (a.u?.tokens ?? 0);
    if (x == null) return 1; // missing values last, whichever way the sort runs
    if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * sd;
  });
  const shown = rows.slice(0, M.shown);
  const tags = (r) => `${r.u ? '<span class="tag you">used</span>' : ""}${r.u?.free ? '<span class="tag">free tier</span>' : ""}${r.c?.reasoning ? '<span class="tag">reasoning</span>' : ""}${r.c?.inputs?.includes("image") ? '<span class="tag">vision</span>' : ""}${r.u && !r.c ? '<span class="tag">not in the list</span>' : ""}${(r.u?.providers ?? []).map((p) => `<span class="tag">via ${esc(providerName(p))}</span>`).join("")}`;
  card.innerHTML = rows.length ? `<div class="table-wrap"><table><thead><tr><th class="sel"></th>${cols.map(([k, l, , left]) => `<th class="${left ? "l" : ""}" data-sort="${k}">${l}${k === sk ? ui(sd < 0 ? "arrow-down" : "arrow-up", 11) : ""}</th>`).join("")}</tr></thead>
    <tbody>${shown.map((r) => `<tr><td class="sel"><input type="checkbox" data-key="${esc(r.key)}" ${M.picked.has(r.key) ? "checked" : ""} aria-label="Compare ${esc(r.name)}"></td>
      <td class="l name"><div class="nm">${vi(r.vendor, 15)}<span class="t" title="${esc(r.c?.name ?? r.name)}">${esc(r.name)}</span>${tags(r)}</div>${r.c && r.u ? `<span class="sub mono">${esc(r.c.id)}${r.c.created ? " · released " + esc(r.c.created) : ""}</span>` : r.c?.created ? `<span class="sub mono">released ${esc(r.c.created)}</span>` : ""}</td>
      <td>${price(r.c?.price?.input)}</td><td>${price(r.c?.price?.output)}</td><td class="muted">${price(r.c?.price?.cacheRead)}</td>
      <td>${num(r.c?.context, compact)}</td><td class="muted">${num(r.c?.maxOutput, compact)}</td>
      <td>${num(r.c?.bench?.intelligence, (v) => v.toFixed(1))}</td><td>${num(r.c?.bench?.coding, (v) => v.toFixed(1))}</td><td>${num(r.c?.bench?.agentic, (v) => v.toFixed(1))}</td><td class="muted">${num(r.c?.bench?.arenaCode, Math.round)}</td>
      <td>${num(r.u?.tokens, compact)}</td><td>${r.u ? costCell(r.u) : '<span class="none-v">-</span>'}</td></tr>`).join("")}</tbody></table></div>
    ${rows.length > shown.length ? `<div class="more"><button class="btn" id="mmore">Show ${Math.min(100, rows.length - shown.length)} more of ${int(rows.length - shown.length)}</button></div>` : ""}` : `<div class="empty">No model matches.</div>`;
  card.querySelectorAll("th[data-sort]").forEach((th) => th.addEventListener("click", () => { const k = th.dataset.sort; M.sort = [k, k === sk ? -sd : k === "name" ? 1 : -1]; drawModelTable(); }));
  card.querySelectorAll("td.sel input").forEach((box) => box.addEventListener("change", () => { box.checked ? M.picked.add(box.dataset.key) : M.picked.delete(box.dataset.key); drawModelBars(); drawModelScatter(); drawModelHead(); }));
  card.querySelector("#mmore")?.addEventListener("click", () => { M.shown += 100; drawModelTable(); });
}

// ==== theme ====================================================================
const THEMES = [["system", "System", "monitor"], ["light", "Latte (light)", "sun"], ["dark", "Macchiato (dark)", "moon"]];
function applyTheme() {
  const light = state.theme === "light" || (state.theme === "system" && matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.dataset.theme = light ? "light" : "dark";
  const cur = THEMES.find((t) => t[0] === state.theme) ?? THEMES[0];
  $("theme").innerHTML = ui(cur[2], 16);
  $("theme").title = `Theme: ${cur[1]} (Shift D)`;
}
function setTheme(t) { state.theme = t; store.setItem("usage.theme", t); applyTheme(); }
const cycleTheme = () => setTheme(THEMES[(THEMES.findIndex((t) => t[0] === state.theme) + 1) % THEMES.length][0]);
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (state.theme === "system") applyTheme(); });

// ==== keyboard, command palette, help ==========================================
const overlay = $("overlay");
const closeOverlay = () => { overlay.innerHTML = ""; };
const isOpen = () => Boolean(overlay.firstChild);
const pickView = (v) => { if (["cost", "tokens", "messages"].includes(v)) { state.metric = v; save(); setView("usage"); } else setView(v); };
const pickRange = (v) => { state.range = v; save(); if (v === "custom" && state.data) { state.from = state.from || state.data.meta.start; state.to = state.to || state.data.meta.end; } controls(); if (v !== "custom" || (state.from && state.to)) reloadUsage(); };
const TABS = ["models", "sessions", "projects", "sources", "agents", "days"];
function stepTab(n) { if (state.view !== "usage") return; state.tab = TABS[(TABS.indexOf(state.tab) + n + TABS.length) % TABS.length]; state.shown = 100; save(); drawTable(); $("tablecard").scrollIntoView({ block: "nearest" }); }
function stepThread(n) {
  const list = state.thr.list?.threads;
  if (!list?.length) return;
  const i = list.findIndex((x) => x.id === state.thr.sel), next = list[Math.max(0, Math.min(list.length - 1, i < 0 ? 0 : i + n))];
  openThread(next.id).then(() => $("tlist")?.querySelector(".ti.on")?.scrollIntoView({ block: "nearest" }));
}
function focusSearch() { const el = state.view === "threads" ? $("tq") : state.view === "models" ? $("mq") : $("q"); el?.focus(); el?.select(); }
function clearFilters() { Object.assign(state, { host: "all", agent: "all", project: "all", model: "all", q: "" }); $("q").value = ""; reloadUsage(); }

// One list drives the shortcuts, the help sheet and the palette, so they cannot drift.
const SHORTCUTS = [
  ["Views", "c", "Cost", () => pickView("cost")], ["Views", "t", "Tokens", () => pickView("tokens")], ["Views", "m", "Messages", () => pickView("messages")],
  ["Views", "o", "Models: prices and benchmarks", () => pickView("models")], ["Views", "l", "Limits", () => pickView("limits")], ["Views", "h", "Threads", () => pickView("threads")],
  ...RANGES.map(([k, l], i) => ["Range", String(i + 1), `Range: ${l}`, () => pickRange(k)]),
  ["Usage", "g", "Cycle chart split: project, agent, model", () => { state.group = GROUPS[(GROUPS.findIndex((x) => x[0] === state.group) + 1) % GROUPS.length][0]; save(); reloadUsage(); }],
  ["Usage", "b", "Toggle lines and bars", () => { state.chart = state.chart === "bars" ? "lines" : "bars"; save(); if (state.view === "usage") render(); }],
  ["Usage", "]", "Next breakdown tab", () => stepTab(1)], ["Usage", "[", "Previous breakdown tab", () => stepTab(-1)],
  ["Usage", "e", "Export the breakdown as CSV", () => $("csv")?.click()],
  ["Usage", "x", "Clear every filter", clearFilters],
  ["Threads", "x", "Clear every thread filter", () => clearThreadFilters()],
  ["Threads", "j", "Next thread", () => stepThread(1)], ["Threads", "k", "Previous thread", () => stepThread(-1)],
  ["Threads", "y", "Copy the command shown in the panel", () => $("resume")?.click()],
  ["General", "/", "Focus search", focusSearch], ["General", "r", "Reload data", () => $("refresh").click()],
  ["General", "Shift D", "Cycle theme: system, Latte, Macchiato", cycleTheme],
  ["General", "Ctrl K", "Command palette", () => openPalette()], ["General", "?", "This guide", () => openHelp()], ["General", "Esc", "Close a dialog or leave a field", closeOverlay],
];
const keyChips = (k) => k.split(" ").map((p) => `<span class="kbd">${esc(p)}</span>`).join("");

function openHelp() {
  const groups = [...new Set(SHORTCUTS.map((s) => s[0]))];
  overlay.innerHTML = `<div class="ov" data-close><div class="pal help" role="dialog" aria-label="Keyboard shortcuts"><h3>Keyboard shortcuts<span class="spacer"></span><button class="icon-btn" data-close aria-label="Close">${ui("x", 15)}</button></h3>
    <div class="cols">${groups.map((g) => `<div><h4>${g}</h4>${SHORTCUTS.filter((s) => s[0] === g).map((s) => `<div class="k"><span>${esc(s[2])}</span><span>${keyChips(s[1])}</span></div>`).join("")}</div>`).join("")}</div></div></div>`;
}

function paletteItems() {
  const items = SHORTCUTS.filter((s) => !["Ctrl K", "Esc"].includes(s[1])).map(([g, k, l, run]) => ({ g, l, k, run }));
  for (const [k, l] of THEMES) items.push({ g: "Theme", l: `Theme: ${l}`, run: () => setTheme(k) });
  const d = state.data;
  if (d) {
    for (const a of d.options.agents) items.push({ g: "Filter", l: `Provider: ${agentName(a)}`, icon: ai(a, 14), run: () => { state.agent = a; pickView(state.view === "models" ? "models" : state.metric); reloadUsage(); } });
    for (const h of d.options.hosts) items.push({ g: "Filter", l: `Environment: ${h}`, run: () => { state.host = h; reloadUsage(); } });
    for (const p of d.options.projects) items.push({ g: "Filter", l: `Project: ${tail(p, 3)}`, run: () => { state.project = p; pickView(state.metric); reloadUsage(); } });
    for (const m of d.options.models) items.push({ g: "Filter", l: `Model: ${m}`, run: () => { state.model = m; pickView(state.metric); reloadUsage(); } });
  }
  for (const x of state.thr.list?.threads ?? []) items.push({ g: "Thread", l: x.title || x.preview || "(untitled)", icon: ai(x.harness, 14), run: () => { state.view = "threads"; save(); openThread(x.id); render(); } });
  return items;
}
// Every typed word must appear in the label or group; earlier matches rank higher.
function paletteFilter(items, text) {
  const words = text.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return items.filter((i) => i.g !== "Filter" && i.g !== "Thread");
  return items.map((i) => { const hay = `${i.l} ${i.g}`.toLowerCase(); const pos = words.map((w) => hay.indexOf(w)); return pos.includes(-1) ? null : [i, pos.reduce((a, b) => a + b, 0)]; }).filter(Boolean).sort((a, b) => a[1] - b[1]).map((x) => x[0]).slice(0, 60);
}
function openPalette() {
  if (!state.thr.list && !state.thr.unavailable) loadThreads().catch(() => {});
  if (!state.data) loadUsage().catch(() => {});
  overlay.innerHTML = `<div class="ov" data-close><div class="pal" role="dialog" aria-label="Command palette"><div class="in">${ui("command", 15)}<input id="palq" placeholder="Type a command, a filter, or a thread title" autocomplete="off" spellcheck="false"></div>
    <div class="list" id="pallist" role="listbox"></div><div class="ft"><span><span class="kbd">Up</span><span class="kbd">Down</span> move</span><span><span class="kbd">Enter</span> run</span><span><span class="kbd">Esc</span> close</span></div></div></div>`;
  const input = $("palq"), list = $("pallist");
  let shown = [], at = 0;
  const draw = () => {
    shown = paletteFilter(paletteItems(), input.value);
    at = Math.min(at, Math.max(0, shown.length - 1));
    let last = "";
    list.innerHTML = shown.length ? shown.map((i, n) => `${i.g !== last ? `<div class="grp">${(last = i.g)}</div>` : ""}<div class="it ${n === at ? "on" : ""}" data-n="${n}" role="option" aria-selected="${n === at}">${i.icon ?? ""}<span class="l">${esc(i.l)}</span>${i.k ? keyChips(i.k) : ""}</div>`).join("") : `<div class="none">Nothing matches.</div>`;
    list.querySelector(".it.on")?.scrollIntoView({ block: "nearest" });
  };
  const run = (n) => { const item = shown[n]; if (!item) return; closeOverlay(); item.run(); };
  input.addEventListener("input", () => { at = 0; draw(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { at = Math.min(shown.length - 1, at + 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { at = Math.max(0, at - 1); draw(); e.preventDefault(); }
    else if (e.key === "Enter") { run(at); e.preventDefault(); }
  });
  list.addEventListener("click", (e) => { const it = e.target.closest(".it"); if (it) run(Number(it.dataset.n)); });
  list.addEventListener("pointermove", (e) => { const it = e.target.closest(".it"); if (it && Number(it.dataset.n) !== at) { at = Number(it.dataset.n); list.querySelectorAll(".it").forEach((el) => el.classList.toggle("on", Number(el.dataset.n) === at)); } });
  draw();
  input.focus();
}
overlay.addEventListener("click", (e) => { if (e.target.dataset.close !== undefined || e.target.closest("button[data-close]")) closeOverlay(); });
$("palbtn").addEventListener("click", openPalette);
$("help").addEventListener("click", openHelp);
$("theme").addEventListener("click", cycleTheme);
if (/Mac|iPhone|iPad/.test(navigator.platform)) $("palbtn").querySelector(".kbd").textContent = "Cmd K";

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); isOpen() ? closeOverlay() : openPalette(); return; }
  if (e.key === "Escape") { if (isOpen()) closeOverlay(); else if (document.activeElement?.matches("input, select")) document.activeElement.blur(); return; }
  // Typing in a field, a held modifier, or an open dialog: the key belongs to that, not to a shortcut.
  if (isOpen() || e.ctrlKey || e.metaKey || e.altKey || e.target.closest?.("input, select, textarea, [contenteditable]")) return;
  const key = e.shiftKey && e.key.toLowerCase() === "d" ? "Shift D" : e.key;
  // A key can mean one thing per view (x clears the usage filters or the thread
  // filters), so the match is the entry that applies where you are.
  const applies = (g) => (g === "Threads" ? state.view === "threads" : g === "Usage" ? state.view === "usage" : g === "Range" ? ["usage", "models"].includes(state.view) : true);
  const hit = SHORTCUTS.find((s) => s[1] === key && applies(s[0]));
  if (!hit) return;
  e.preventDefault();
  hit[3]();
});

// ==== wiring ===================================================================
const fail = (e) => { if (e.name !== "AbortError") $("main").innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`; };
const reloadUsage = () => (state.view === "models" ? Promise.all([loadModels(), loadUsage()]).catch(fail) : loadUsage().catch(fail));
function setView(v) {
  const changed = v !== state.view;
  state.view = v; save();
  if (changed) { window.scrollTo(0, 0); const m = $("main"); m.classList.remove("enter"); void m.offsetWidth; m.classList.add("enter"); setTimeout(() => m.classList.remove("enter"), 220); }
  if (v !== "threads") history.replaceState(null, "", location.pathname);
  render();
  if (v === "limits") loadLimits().catch(fail);
  if (v === "threads" && !state.thr.list) loadThreads().catch(fail);
  if (v === "usage" && !state.data) reloadUsage();
  if (v === "models") { loadModels().catch(fail); if (!state.data) loadUsage().catch(() => {}); }
}
$("view").addEventListener("click", (e) => {
  const v = e.target.closest("button")?.dataset.v;
  if (!v) return;
  if (v === "cost" || v === "tokens" || v === "messages") { state.metric = v; save(); setView("usage"); } else setView(v);
});
$("range").addEventListener("click", (e) => { const v = e.target.closest("button")?.dataset.v; if (!v) return; state.range = v; save(); if (v === "custom" && state.data) { state.from = state.from || state.data.meta.start; state.to = state.to || state.data.meta.end; } controls(); if (v !== "custom" || (state.from && state.to)) reloadUsage(); });
$("main").addEventListener("click", (e) => {
  const g = e.target.closest("#group button"), c = e.target.closest("#ctype button");
  if (g) { state.group = g.dataset.v; save(); reloadUsage(); }
  if (c) { state.chart = c.dataset.v; save(); renderUsage(); controls(); }
});
$("clear").addEventListener("click", clearFilters);
const reloadThreads = () => { state.thr.limit = 200; loadThreads().catch(fail); };
for (const [key, id] of THREAD_FILTERS) $(id).addEventListener("change", (e) => { state.thr[key] = e.target.value; reloadThreads(); });
$("t-days").addEventListener("change", (e) => { state.thr.days = e.target.value; reloadThreads(); });
$("t-sub").addEventListener("change", (e) => { state.thr.sub = e.target.checked; reloadThreads(); });
function clearThreadFilters() { Object.assign(state.thr, { q: "", agent: "all", host: "all", model: "all", project: "all", days: "0", sub: false }); if ($("tq")) $("tq").value = ""; reloadThreads(); }
$("tclear").addEventListener("click", clearThreadFilters);
for (const k of ["host", "agent", "project", "model"]) $("f-" + k).addEventListener("change", (e) => { state[k] = e.target.value; state.shown = 100; reloadUsage(); });
$("q").addEventListener("input", debounce((e) => { state.q = e.target.value; state.shown = 100; reloadUsage(); }, 250));
for (const id of ["from", "to"]) $(id).addEventListener("change", (e) => { state[id] = e.target.value; if (state.from && state.to && state.from <= state.to) { state.range = "custom"; save(); reloadUsage(); } });
$("refresh").addEventListener("click", async () => {
  const b = $("refresh"); b.classList.add("spin");
  try { if (state.view === "models") await loadModels(true); else if (state.view === "limits") await loadLimits(true); else if (state.view === "threads") await loadThreads(true); else await loadUsage(true); } catch (e) { fail(e); } finally { b.classList.remove("spin"); }
});
let resizeTimer;
new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { document.documentElement.style.setProperty("--hh", $("top").offsetHeight + "px"); if (state.view === "usage" && state.data && $("chart")) drawChart(); }, 120); }).observe(document.body);
setInterval(() => {
  if (document.hidden) return;
  if ($("overlay").firstChild) return;
  if (state.view === "usage") reloadUsage();
  else if (state.view === "limits") loadLimits().catch(() => {});
}, 60000);

if (!["cost", "tokens", "messages"].includes(state.metric)) state.metric = "cost";
applyTheme();
const hash = /^#threads\/([\w-]+)$/.exec(location.hash);
if (hash) { state.view = "threads"; state.thr.sel = hash[1]; openThread(hash[1]); }
setView(state.view);
</script>
</body>
