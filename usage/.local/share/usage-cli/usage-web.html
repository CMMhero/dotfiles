<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage</title>
<link rel="preload" href="/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Geist"; src: url("/assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url("/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    --bg: #100e16;
    --panel: #171420;
    --panel-2: #1e1a29;
    --line: #2a2536;
    --line-2: #221e2d;
    --text: #efebf8;
    --muted: #918aa2;
    --faint: #625b72;
    --accent: #8b6cf0;
    --accent-soft: rgba(139, 108, 240, .16);
    --good: #7fd6a2;
    --warn: #e0b341;
    --bad: #ef6b6b;
    --heat-0: #1f1b29; --heat-1: #382d62; --heat-2: #4f3f98; --heat-3: #6e55d1; --heat-4: #a28cff;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 13px/1.5 var(--sans); font-feature-settings: "tnum" 1, "cv11" 1; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code, pre, .mono { font-family: var(--mono); font-size: 12px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2f2a3d; border-radius: 8px; border: 2px solid var(--bg); }

  /* ---- header ----------------------------------------------------------- */
  .top { position: sticky; top: 0; z-index: 20; background: rgba(16,14,22,.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 10px clamp(16px, 2.2vw, 36px); }
  .row + .row { border-top: 1px solid var(--line-2); padding-top: 8px; padding-bottom: 8px; }
  .brand { font-weight: 600; font-size: 14px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .spacer { flex: 1; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
  .seg button { background: transparent; border: 0; border-radius: 7px; padding: 4px 11px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--accent-soft); color: var(--text); box-shadow: inset 0 0 0 1px rgba(139,108,240,.45); }
  .seg.nav button { padding: 5px 14px; }
  .field { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; min-width: 0; }
  select.field { appearance: none; padding-right: 26px; cursor: pointer; max-width: 220px; text-overflow: ellipsis;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  select.field option { background: var(--panel-2); }
  select.field.on { border-color: rgba(139,108,240,.6); color: var(--text); }
  .search { position: relative; }
  .search input { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px 5px 30px; width: min(320px, 38vw); outline: none; }
  .search input:focus { border-color: rgba(139,108,240,.6); }
  .search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  input[type="date"] { color-scheme: dark; }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 5px 11px; color: var(--text); font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
  .btn:hover { border-color: #3a3450; background: var(--panel-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .icon-btn { background: transparent; border: 1px solid transparent; border-radius: 9px; width: 32px; height: 32px; color: var(--muted); display: inline-grid; place-items: center; }
  .icon-btn:hover { color: var(--text); background: var(--panel); }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .label { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 500; }

  /* ---- layout ------------------------------------------------------------ */
  main { padding: 20px clamp(16px, 2.2vw, 36px) 56px; display: grid; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .grid { display: grid; gap: 16px; }
  .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .tiles4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tiles6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  @media (max-width: 1280px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .tiles6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .tiles, .tiles4, .tiles6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .split { grid-template-columns: minmax(0, 1fr) 360px; }
  @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }

  .tile { padding: 14px 16px 12px; position: relative; overflow: hidden; min-height: 92px; }
  .tile .k { display: flex; align-items: center; gap: 6px; }
  .tile .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; margin-top: 4px; display: flex; align-items: baseline; gap: 8px; }
  .tile.sm .v { font-size: 20px; }
  .est { font-size: 9px; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; letter-spacing: .06em; }
  .delta { font-size: 11px; font-weight: 500; color: var(--muted); background: var(--panel-2); border-radius: 6px; padding: 1px 6px; letter-spacing: 0; }
  .delta.up { color: #e9b08a; } .delta.down { color: #8fc7e8; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 26px; margin-top: 8px; }
  .spark i { flex: 1; min-width: 1px; background: var(--accent); border-radius: 1px; opacity: .85; min-height: 1px; }
  .spark i.z { background: var(--line); opacity: 1; }
  .dots { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, 5px); gap: 2px; margin-top: 10px; }
  .dots i { width: 100%; background: var(--line); border-radius: 1px; }
  .dots i.on { background: #d9d3ea; }
  .bar2 { display: flex; gap: 2px; margin-top: 10px; height: 10px; }
  .bar2 i { flex: 1; background: var(--line); border-radius: 1px; }
  .bar2 i.on { background: var(--good); }
  .tile .pct { position: absolute; top: 14px; right: 16px; color: var(--faint); font-size: 11px; }

  .card-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; flex-wrap: wrap; }
  .card-b { padding: 8px 16px 14px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis text { fill: var(--faint); font-size: 10px; font-family: var(--mono); }
  .gridline { stroke: var(--line); stroke-width: 1; }
  .keys { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; color: var(--muted); font-size: 11.5px; }
  .keys span { display: inline-flex; align-items: center; gap: 6px; max-width: 360px; }
  .keys span b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; }
  .sq { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tip { position: absolute; pointer-events: none; z-index: 40; min-width: 170px; max-width: 340px; background: #0b0910; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; box-shadow: 0 10px 30px rgba(0,0,0,.55); font-size: 12px; opacity: 0; transition: opacity .08s; }
  .tip.on { opacity: 1; }
  .tip .t { color: var(--muted); margin-bottom: 4px; }
  .tip .r { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .tip .r span:first-child { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tip .r span:first-child b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; }

  .insight { display: flex; flex-direction: column; justify-content: space-between; min-height: 100%; padding: 14px 18px; }
  .insight .big { font-size: 40px; font-weight: 600; letter-spacing: -.03em; line-height: 1; margin-top: 18px; }
  .insight p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .insight p b { color: var(--text); font-weight: 500; }
  .pager { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .pager .dotset { display: flex; gap: 4px; }
  .pager .dotset i { width: 14px; height: 3px; border-radius: 2px; background: var(--line); }
  .pager .dotset i.on { background: var(--good); }

  /* ---- heatmap ----------------------------------------------------------- */
  .heat-wrap { overflow-x: auto; }
  .heat svg { display: block; width: 100%; min-width: 760px; max-width: 1240px; height: auto; }
  .heat text { fill: var(--faint); font-size: 10px; font-family: var(--mono); }
  .heat rect.cell { stroke: rgba(255,255,255,.04); stroke-width: 1; }
  .heat rect.cell:hover { stroke: var(--text); }
  .heat-foot { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 6px; color: var(--muted); font-size: 11px; }
  .heat-foot i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  /* ---- tabs + tables ----------------------------------------------------- */
  .tabs { display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 12px 10px 10px; color: var(--muted); font-weight: 500; display: inline-flex; gap: 7px; align-items: center; }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
  .count { font-size: 10.5px; background: var(--panel-2); color: var(--muted); border-radius: 6px; padding: 0 6px; }
  .tabs .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; padding: 6px 0; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { color: var(--faint); font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; text-align: right; padding: 9px 12px; white-space: nowrap; border-bottom: 1px solid var(--line-2); user-select: none; }
  th.l, td.l { text-align: left; }
  th[data-sort] { cursor: pointer; }
  th[data-sort]:hover { color: var(--text); }
  th .arr { color: var(--accent); margin-left: 3px; }
  td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
  td.l { white-space: normal; }
  td.main { max-width: 560px; }
  td .ttl { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 560px; }
  td .sub { display: block; color: var(--faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 560px; }
  td .agent { display: inline-flex; align-items: center; gap: 7px; }
  tbody tr:hover { background: rgba(255,255,255,.025); }
  tr.click { cursor: pointer; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .unp { color: var(--warn); }
  .more { display: flex; justify-content: center; padding: 12px; }
  .empty { padding: 56px 24px; text-align: center; color: var(--muted); }
  .foot { color: var(--faint); font-size: 11.5px; display: grid; gap: 4px; padding-top: 4px; }
  .foot .hosts { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .foot .stale, .warn { color: var(--warn); }
  .share { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .share i { display: block; width: 64px; height: 4px; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
  .share i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--c, var(--accent)); border-radius: 2px; }

  /* ---- limits ------------------------------------------------------------ */
  .limits { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  .lim { padding: 18px 20px; display: grid; gap: 16px; align-content: start; }
  .lim h3 { margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .lim .plan { font-size: 11px; background: var(--accent-soft); color: #cbbcff; border-radius: 6px; padding: 1px 8px; font-weight: 500; }
  .win .top2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .win .name { font-weight: 500; }
  .win .pc { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  .meter { height: 8px; background: var(--panel-2); border-radius: 5px; overflow: hidden; margin: 8px 0 6px; }
  .meter i { display: block; height: 100%; border-radius: 5px; background: var(--good); }
  .meter.mid i { background: var(--warn); } .meter.hot i { background: var(--bad); } .meter.stale i { background: var(--faint); }
  .win .when { color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line-2); padding-top: 10px; }
  .note.bad { color: var(--warn); }

  /* ---- threads ------------------------------------------------------------ */
  .threads { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); gap: 16px; height: calc(100vh - 150px); min-height: 480px; }
  @media (max-width: 960px) { .threads { grid-template-columns: 1fr; height: auto; } }
  .tl { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .tl .bar { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
  .tl .bar .field { flex: 1; min-width: 120px; }
  .tl .scroll, .td .scroll { overflow-y: auto; min-height: 0; flex: 1; }
  .ti { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px; padding: 11px 14px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
  .ti:hover { background: rgba(255,255,255,.025); }
  .ti.on { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .ti .t { font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .ti .m { grid-column: 2 / 4; color: var(--faint); font-size: 11.5px; display: flex; gap: 10px; flex-wrap: wrap; }
  .ti .when { color: var(--faint); font-size: 11.5px; }
  .td { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .td header { padding: 16px 20px 12px; border-bottom: 1px solid var(--line-2); display: grid; gap: 10px; }
  .td h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 12px; }
  .facts b { color: var(--text); font-weight: 500; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .cmd { background: #0b0910; border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; display: flex; gap: 10px; align-items: center; }
  .cmd code { flex: 1; overflow-x: auto; white-space: nowrap; color: #d9d3ea; }
  .msgs { padding: 16px 20px 28px; display: grid; gap: 14px; }
  .msg { display: grid; gap: 6px; }
  .msg .who { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; display: flex; gap: 8px; }
  .msg.user .body { background: var(--accent-soft); border: 1px solid rgba(139,108,240,.3); border-radius: 12px; padding: 10px 14px; white-space: pre-wrap; word-break: break-word; }
  .msg .body { word-break: break-word; }
  .msg .body p { margin: 0 0 8px; white-space: pre-wrap; }
  .msg .body pre { background: #0b0910; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 6px 0; }
  .msg .body code.i { background: var(--panel-2); border-radius: 4px; padding: 1px 5px; }
  details.blk { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
  details.blk summary { cursor: pointer; padding: 6px 10px; color: var(--muted); font-size: 12px; list-style: none; display: flex; gap: 8px; align-items: center; }
  details.blk summary::before { content: "▸"; color: var(--faint); }
  details.blk[open] summary::before { content: "▾"; }
  details.blk pre { margin: 0; padding: 8px 12px 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; border-top: 1px solid var(--line); color: #cfc8e0; max-height: 360px; overflow-y: auto; }
  .pill { font-size: 10.5px; border-radius: 6px; padding: 0 7px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .hide { display: none !important; }
  .custom { display: none; align-items: center; gap: 6px; }
  .custom.on { display: inline-flex; }
</style>
</head>
<body>
<div class="top">
  <div class="row">
    <div class="brand"><i></i>Usage</div>
    <div class="seg nav" id="nav" role="tablist" aria-label="View">
      <button data-v="usage" role="tab">Usage</button>
      <button data-v="limits" role="tab">Limits</button>
      <button data-v="threads" role="tab">Threads</button>
    </div>
    <div class="spacer"></div>
    <span class="faint mono" id="stamp"></span>
    <button class="icon-btn" id="refresh" title="Reload" aria-label="Reload">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
  <div class="row" id="filters">
    <select class="field" id="f-host" aria-label="Host"></select>
    <select class="field" id="f-agent" aria-label="Agent"></select>
    <select class="field" id="f-project" aria-label="Project"></select>
    <select class="field" id="f-model" aria-label="Model"></select>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search sessions, projects, models" autocomplete="off" aria-label="Search">
    </label>
    <div class="seg" id="range" role="group" aria-label="Range"></div>
    <span class="custom" id="custom"><input class="field" type="date" id="from" aria-label="From"><span class="faint">to</span><input class="field" type="date" id="to" aria-label="To"></span>
    <div class="spacer"></div>
    <span style="display:inline-flex;gap:8px;align-items:center"><span class="label">Show</span><div class="seg" id="metric" role="group" aria-label="Metric"></div></span>
  </div>
</div>
<main id="main"><div class="empty">Loading…</div></main>
<div class="tip" id="tip" role="tooltip"></div>
<script>
"use strict";

// ==== icons ===================================================================
// One mark per agent, drawn from the agent's own logo where it has a simple one.
const PATHS = {

function icon(name, size = 15) {
  const k = agentKey(name), c = agentColor(name);
  const wrap = (inner) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" style="flex:none">${inner}</svg>`;
  if (k === "claude") {
    // Twelve rays of uneven length, the shape of the Claude mark.
    const lens = [10.5, 7.5, 9.5, 7, 10, 7.8, 10.5, 7.2, 9.4, 7.6, 10, 7.4];
    return wrap(lens.map((l, i) => {
      const a = (i * 30 - 90) * Math.PI / 180;
      return `<line x1="${12 + Math.cos(a) * 2.6}" y1="${12 + Math.sin(a) * 2.6}" x2="${12 + Math.cos(a) * l}" y2="${12 + Math.sin(a) * l}" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>`;
    }).join(""));
  }
  if (k === "codex") return wrap(`<path fill="${c}" d="${PATHS.openai}"/>`);
  if (k === "gemini") return wrap(`<path fill="${c}" d="${PATHS.gemini}"/>`);
  if (PATHS[k]) return wrap(`<path fill="${c}" d="${PATHS[k]}" fill-rule="evenodd"/>`);
  if (k === "cline") return wrap(`<rect x="3" y="6" width="18" height="14" rx="4" fill="none" stroke="${c}" stroke-width="2"/><circle cx="9" cy="13" r="1.6" fill="${c}"/><circle cx="15" cy="13" r="1.6" fill="${c}"/><path d="M12 6V3" stroke="${c}" stroke-width="2" stroke-linecap="round"/>`);
  const letter = String(name || "?")[0].toUpperCase();
  return wrap(`<rect x="2" y="2" width="20" height="20" rx="6" fill="${c}" opacity=".25"/><text x="12" y="16.5" text-anchor="middle" font-size="12" font-weight="600" fill="${c}" font-family="Geist,sans-serif">${letter}</text>`);
}

// ==== state ====================================================================

const store = (() => { try { return window.localStorage; } catch { return { getItem: () => null, setItem() {} }; } })();

const state = {

  host: "all", agent: "all", project: "all", model: "all", q: "",
  group: pref("group", "project"), metric: pref("metric", "tokens"), tab: pref("tab", "sessions"),
  sort: {}, shown: 100, insight: 0,
  data: null, limits: null,
  thr: { q: "", agent: "all", sub: false, list: null, sel: null, detail: null, cmd: null, unavailable: null },
};
const save = () => { for (const k of ["view", "range", "group", "metric", "tab"]) store.setItem("usage." + k, state[k]); };

const RANGES = [["1d", "Today"], ["7d", "7d"], ["30d", "30d"], ["90d", "90d"], ["1y", "1y"], ["all", "All"], ["custom", "Custom"]];

// ==== formatting ===============================================================
const compact = (n) => {
  n = Number(n || 0);
  const a = Math.abs(n);
  if (a >= 1e12) return (n / 1e12).toFixed(2) + "T";
  if (a >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e8 ? 0 : a >= 1e7 ? 1 : 2) + "M";
  if (a >= 1e3) return (n / 1e3).toFixed(a >= 1e5 ? 0 : 1) + "K";
  return String(Math.round(n));
};
const int = (n) => Number(n || 0).toLocaleString("en-US");
const money = (n, d = 2) => "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const axisMoney = (n) => (n >= 1000 ? "$" + (n / 1000).toFixed(n % 1000 ? 1 : 0) + "K" : "$" + (n >= 10 ? Math.round(n) : n.toFixed(n ? 1 : 0)));
const plural = (n, w) => `${int(n)} ${w}${n === 1 ? "" : "s"}`;
const pct = (a, b) => (b ? (a / b) * 100 : 0);
const pctText = (v) => (v > 0 && v < 0.1 ? "<0.1%" : v.toFixed(v >= 10 ? 0 : 1) + "%");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shortDay = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
const longDay = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
const duration = (ms) => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; };
const tail = (p, n = 2) => { const parts = String(p || "").split(/[\\/]/).filter(Boolean); return parts.length ? parts.slice(-n).join("/") : "(none)"; };
const ago = (iso) => {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  if (s < 129600) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};
const until = (iso) => {
  const s = (Date.parse(iso) - Date.now()) / 1000;
  if (s <= 0) return "now";
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
};
const metricVal = (o, m = state.metric) => (m === "cost" ? o.cost : m === "messages" ? o.messages : o.tokens);
const fmtMetric = (v, m = state.metric) => (m === "cost" ? money(v) : compact(v));

function costCell(o) {
  if (o.unpricedRows && !o.cost) return `<span class="unp">Unpriced</span>`;
  return money(o.cost) + (o.unpricedRows ? `<span class="unp" title="${o.unpricedRows} unpriced rows">*</span>` : "");
}

function delta(cur, prev, label) {
  if (prev === null || prev === undefined) return "";
  if (!prev) return cur ? `<span class="delta" title="No usage in the previous period">new</span>` : "";
  const ch = ((cur - prev) / prev) * 100;
  if (Math.abs(ch) < 0.5) return `<span class="delta" title="${esc(label)}">0%</span>`;
  const a = Math.abs(ch), big = a >= 1000 ? ">999" : a >= 10 ? Math.round(a) : a.toFixed(1);
  return `<span class="delta ${ch > 0 ? "up" : "down"}" title="${esc(label)}${a >= 1000 ? ` (${Math.round(a).toLocaleString("en-US")}%)` : ""}">${ch > 0 ? "▲" : "▼"} ${big}%</span>`;
}

// ==== tooltip ==================================================================
const tip = $("tip");
function showTip(html, ev) {
  tip.innerHTML = html;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > window.innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > window.innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.position = "fixed";
  tip.style.left = Math.max(4, x) + "px";
  tip.style.top = Math.max(4, y) + "px";
  tip.classList.add("on");
}
const hideTip = () => tip.classList.remove("on");

// ==== fetching =================================================================
const get = async (url, signal) => {
  const res = await fetch(url, { signal });
  const body = await res.json();
  if (!res.ok || body.error) throw new Error(body.error || res.statusText);
  return body;
};
let usageCtl = null;
async function loadUsage(fresh = false) {
  usageCtl?.abort();
  usageCtl = new AbortController();
  const q = new URLSearchParams({ range: state.range, group: state.group });
  for (const k of ["host", "agent", "project", "model"]) if (state[k] !== "all") q.set(k === "agent" ? "harness" : k, state[k]);
  if (state.q.trim()) q.set("q", state.q.trim());
  if (state.range === "custom" && state.from && state.to) { q.set("from", state.from); q.set("to", state.to); }
  if (fresh) q.set("fresh", "1");
  state.data = await get("/api/usage?" + q, usageCtl.signal);
  stamp();
  render();
}
async function loadLimits(fresh = false) {
  state.limits = await get("/api/limits" + (fresh ? "?fresh=1" : ""));
  stamp();
  if (state.view === "limits") render();
}
let thrCtl = null;
async function loadThreads(fresh = false) {
  thrCtl?.abort();
  thrCtl = new AbortController();
  const t = state.thr;
  const q = new URLSearchParams({ q: t.q, harness: t.agent, subagents: t.sub ? "1" : "0" });
  if (fresh) q.set("fresh", "1");
  const body = await get("/api/threads?" + q, thrCtl.signal);
  if (body.unavailable) { t.unavailable = body.unavailable; t.list = null; } else { t.unavailable = null; t.list = body; }
  if (state.view !== "threads") return;
  if ($("tlist") && t.list) refreshThreadList(); else render();
}
async function openThread(id) {
  const t = state.thr;
  t.sel = id; t.detail = null; t.cmd = null;
  history.replaceState(null, "", "#threads/" + id);
  if (state.view === "threads") render();
  try {
    t.detail = await get("/api/threads/show?id=" + encodeURIComponent(id));
  } catch (e) { t.detail = { error: e.message }; }
  if (state.view === "threads" && t.sel === id) renderThreadDetail();
}
const stamp = () => { $("stamp").textContent = "updated " + new Date().toLocaleTimeString("en-GB"); };

// ==== header controls ==========================================================
function segHTML(items, current) {
  return items.map(([k, l]) => `<button data-v="${k}" aria-pressed="${current === k}">${l}</button>`).join("");
}
function fillSelect(el, all, items, current, nameOf = (x) => x) {
  const html = `<option value="all">${esc(all)}</option>` + items.map((v) => `<option value="${esc(v)}">${esc(nameOf(v))}</option>`).join("");
  if (el.dataset.sig !== html) { el.innerHTML = html; el.dataset.sig = html; }
  el.value = items.includes(current) ? current : "all";
  el.classList.toggle("on", el.value !== "all");
}
function controls() {
  for (const b of $("nav").children) b.setAttribute("aria-selected", String(b.dataset.v === state.view));
  $("filters").classList.toggle("hide", state.view !== "usage");
  $("range").innerHTML = segHTML(RANGES, state.range);
  if ($("group")) $("group").innerHTML = segHTML(GROUPS, state.group);
  $("metric").innerHTML = segHTML(METRICS, state.metric);
  $("custom").classList.toggle("on", state.range === "custom");
  const d = state.data;
  if (d) {
    fillSelect($("f-host"), "All hosts", d.options.hosts, state.host);
    fillSelect($("f-agent"), "All agents", d.options.agents, state.agent, agentName);
    fillSelect($("f-project"), "All projects", d.options.projects, state.project, (p) => tail(p, 2));
    fillSelect($("f-model"), "All models", d.options.models, state.model);
    if (state.range !== "custom" && d.meta) { $("from").value = d.meta.start; $("to").value = d.meta.end; }
  }
}

// ==== render dispatch ==========================================================
function render() {
  controls();
  if (state.view === "limits") return renderLimits();
  if (state.view === "threads") return renderThreads();
  renderUsage();
}

// ==== usage view ===============================================================
function spark(values, cls = "") {
  const max = Math.max(...values, 0);
  return `<div class="spark ${cls}" aria-hidden="true">${values.map((v) => `<i class="${v ? "" : "z"}" style="height:${v && max ? Math.max(8, (v / max) * 100) : 4}%"></i>`).join("")}</div>`;
}
function dots(share, n = 40) {
  const on = share > 0 ? Math.max(1, Math.round(share * n)) : 0;
  return `<div class="bar2" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i class="${i < on ? "on" : ""}"></i>`).join("")}</div>`;
}

function tile(label, value, d, extra, { est = false, small = false } = {}) {
  return `<div class="panel tile ${small ? "sm" : ""}"><div class="k label">${label}${est ? '<span class="est">EST.</span>' : ""}</div>
    <div class="v">${value}${d}</div>${extra ?? ""}</div>`;
}

function renderUsage() {
  const d = state.data, main = $("main");
  if (!d) return;
  if (!d.hosts.length) {
    main.innerHTML = `<div class="empty panel">No host snapshots in <code>${esc(d.meta.usageDir)}</code> yet.<br>Run <code>usage collect</code>, then reload.</div>`;
    return;
  }
  const t = d.totals, p = d.previous, prevLabel = p ? `vs ${d.meta.span} days before (${d.meta.previous.start} to ${d.meta.previous.end})` : "";
  const dl = (cur, prev) => delta(cur, p ? prev : null, prevLabel);
  const unp = t.unpricedRows ? '<span class="unp" title="Some rows have no price">*</span>' : "";

  const tiles = `<section class="grid tiles">
    ${tile("Tokens", compact(t.tokens), dl(t.tokens, p?.tokens), spark(d.sparks.tokens))}
    ${tile("Cost", money(t.cost) + unp, dl(t.cost, p?.cost), spark(d.sparks.cost), { est: true })}
    ${tile("Sessions", int(t.sessions), dl(t.sessions, p?.sessions), spark(d.sparks.sessions))}
    ${tile("Messages", int(t.messages), dl(t.messages, p?.messages), spark(d.sparks.messages))}
    ${tile("Cache hit rate", Math.round(t.cacheHitRate * 100) + "%", dl(t.cacheHitRate, p?.cacheHitRate), spark(d.sparks.cacheHitRate))}
  </section>`;

  const types = [["Input", t.input], ["Output", t.output], ["Cache read", t.cacheRead], ["Cache write", t.cacheWrite]];
  const typeSum = types.reduce((s, x) => s + x[1], 0) || 1;
  const prevTypes = p ? { Input: p.input, Output: p.output, "Cache read": p.cacheRead, "Cache write": p.cacheWrite } : null;
  const typeRow = `<section class="grid tiles4">${types.map(([n, v]) => `<div class="panel tile sm"><div class="k label">${n}</div><span class="pct">${pctText(pct(v, typeSum))}</span>
    <div class="v">${compact(v)}${dl(v, prevTypes?.[n])}</div>${dots(v / typeSum)}</div>`).join("")}</section>`;

  const chartCard = `<div class="panel"><div class="card-h"><span class="label">${METRICS.find((m) => m[0] === state.metric)[1]} by day, per ${state.group}</span><span class="spacer"></span><span class="faint mono">${esc(d.meta.start)} to ${esc(d.meta.end)}</span><div class="seg" id="group" role="group" aria-label="Stack chart by">${segHTML(GROUPS, state.group)}</div></div>
    <div class="card-b"><div class="chart" id="chart"></div><div class="keys" id="keys"></div></div></div>`;
  const insightCard = `<div class="panel insight" id="insight"></div>`;

  const eff = `<section class="panel"><div class="card-h"><span class="label">Efficiency</span></div><div class="card-b grid tiles6" style="gap:0">
    ${effCell("Cache hit rate", Math.round(t.cacheHitRate * 100) + "%", dl(t.cacheHitRate, p?.cacheHitRate), dots(t.cacheHitRate, 36))}
    ${effCell("Output : input", t.outputPerInput == null ? "-" : t.outputPerInput.toFixed(1) + "×", dl(t.outputPerInput, p?.outputPerInput))}
    ${effCell("Tokens / session", t.tokensPerSession == null ? "-" : compact(t.tokensPerSession), dl(t.tokensPerSession, p?.tokensPerSession))}
    ${effCell("Cost / session", t.costPerSession == null ? "-" : money(t.costPerSession), dl(t.costPerSession, p?.costPerSession), "", true)}
    ${effCell("Cost / message", t.costPerMessage == null ? "-" : money(t.costPerMessage), dl(t.costPerMessage, p?.costPerMessage), "", true)}
    ${effCell("$ / 1K output", t.costPer1kOutput == null ? "-" : money(t.costPer1kOutput), dl(t.costPer1kOutput, p?.costPer1kOutput), "", true)}
  </div></section>`;

  const foot = `<div class="foot"><div class="hosts">${d.hosts.map(hostChip).join("")}</div>
    ${d.meta.warnings.map((w) => `<div class="warn">${esc(w)}</div>`).join("")}
    ${t.unpricedRows ? `<div>* ${plural(t.unpricedRows, "row")} had no price and are left out of the dollar figures. Add rates in <span class="mono">dot_config/usage/prices.json</span>.</div>` : ""}
    <div>Reasoning is shown beside output and never added. Windows count back from the newest day in the data (${esc(d.meta.newestDay)}). Prices ${d.meta.priceFetchedAt ? "fetched " + esc(d.meta.priceFetchedAt.slice(0, 10)) : "not cached yet; run <span class='mono'>usage prices update</span>"}.</div></div>`;

  main.innerHTML = tiles + typeRow +
    `<section class="grid split">${chartCard}${insightCard}</section>` + eff +
    `<section class="panel"><div class="card-h"><span class="label">Activity, last year</span></div><div class="card-b"><div class="heat-wrap heat" id="heat"></div>
      <div class="heat-foot"><span>Less</span>${[0, 1, 2, 3, 4].map((i) => `<i style="background:var(--heat-${i})"></i>`).join("")}<span>More</span></div></div></section>` +
    `<section class="panel" id="tablecard"></section>` + foot;

  drawChart(); drawInsight(); drawHeat(); drawTable();
}
function effCell(label, value, d, extra = "", est = false) {
  return `<div style="padding:4px 14px 8px 0"><div class="label" style="font-size:10.5px">${label}${est ? ' <span class="est">EST.</span>' : ""}</div><div style="font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px;display:flex;gap:8px;align-items:baseline">${value}${d}</div>${extra}</div>`;
}
function hostChip(h) {
  const age = Math.max(0, Math.round((Date.now() - Date.parse(h.collectedAt)) / 3600000));
  return `<span class="${age > 24 ? "stale" : ""}" title="collected ${esc(h.collectedAt)}">${esc(h.host)} · ${age}h${age > 24 ? " stale" : ""}</span>`;
}

// ---- stacked day chart ---------------------------------------------------------
const PALETTE = ["#8b6cf0", "#4f9ddb", "#3fb8a0", "#e9724c", "#e0b341", "#f08fb0", "#9bcf5f"];
const OTHER = "#5d5670";
const stackColor = (s, i) => (s.key === "Other" && s.other ? OTHER : state.data.meta.group === "agent" ? agentColor(s.key) : PALETTE[i % PALETTE.length]);
const stackLabel = (s) => (s.key === "Other" && s.other ? `Other (${s.other})` : state.data.meta.group === "project" ? tail(s.key, 2) : state.data.meta.group === "agent" ? agentName(s.key) : s.key);

function niceMax(v) {
  if (v <= 0) return 3;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / p;
  return ([1.5, 3, 6, 9, 15].find((c) => c >= f - 1e-9) ?? 15) * p;
}

function drawChart() {
  const d = state.data, el = $("chart");
  if (!el) return;
  const m = state.metric, days = d.days, series = d.stack;
  const W = Math.max(480, el.clientWidth), H = 270, L = 52, R = 8, T = 8, B = 24;
  const pw = W - L - R, ph = H - T - B;
  const totals = days.map((_, i) => series.reduce((s, x) => s + x[m][i], 0));
  const max = niceMax(Math.max(0, ...totals));
  const y = (v) => T + ph - (v / max) * ph;
  const slot = pw / days.length, bw = Math.max(1, Math.min(34, slot * 0.72));
  const fmt = (v) => (m === "cost" ? axisMoney(v) : compact(v));

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${m} by day"><g class="axis">`;
  for (let i = 0; i <= 3; i++) {
    const v = (max / 3) * i;
    svg += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 3}" text-anchor="end">${i === 0 ? "0" : fmt(v)}</text>`;
  }
  const ticks = Math.min(days.length, Math.max(2, Math.floor(pw / 90)));
  for (let i = 0; i < ticks; i++) {
    const idx = ticks === 1 ? 0 : Math.round((i / (ticks - 1)) * (days.length - 1));
    svg += `<text x="${L + slot * idx + slot / 2}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === ticks - 1 ? "end" : "middle"}">${shortDay(days[idx])}</text>`;
  }
  svg += `</g><rect id="band" y="${T}" height="${ph}" width="${slot}" fill="#fff" opacity="0"/>`;
  days.forEach((_, i) => {
    let base = 0;
    series.forEach((s, si) => {
      const v = s[m][i];
      if (!v) return;
      const x = L + slot * i + (slot - bw) / 2;
      svg += `<rect x="${x}" y="${y(base + v)}" width="${bw}" height="${Math.max(1, y(base) - y(base + v))}" fill="${stackColor(s, si)}" rx="1.5"/>`;
      base += v;
    });
  });
  svg += `<rect id="hit" x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent"/></svg>`;
  el.innerHTML = svg;

  $("keys").innerHTML = series.map((s, i) => `<span title="${esc(s.key)}"><i class="sq" style="background:${stackColor(s, i)}"></i><b>${esc(stackLabel(s))}</b></span>`).join("");

  const hit = el.querySelector("#hit"), band = el.querySelector("#band");
  hit.addEventListener("pointermove", (ev) => {
    const r = el.querySelector("svg").getBoundingClientRect();
    const i = Math.max(0, Math.min(days.length - 1, Math.floor(((ev.clientX - r.left) / r.width * W - L) / slot)));
    band.setAttribute("x", L + slot * i); band.setAttribute("opacity", ".06");
    const rows = series.map((s, si) => [s, si, s[m][i]]).filter((x) => x[2] > 0).sort((a, b) => b[2] - a[2]);
    const total = totals[i];
    showTip(`<div class="t">${longDay(days[i])}</div>` + (rows.map(([s, si, v]) => `<div class="r"><span><i class="sq" style="background:${stackColor(s, si)}"></i><b>${esc(stackLabel(s))}</b></span><b class="mono">${fmtMetric(v)}</b></div>`).join("") || `<div class="muted">No usage</div>`) +
      (rows.length > 1 ? `<div class="r" style="margin-top:4px;border-top:1px solid var(--line);padding-top:4px"><span>Total</span><b class="mono">${fmtMetric(total)}</b></div>` : ""), ev);
  });
  hit.addEventListener("pointerleave", () => { band.setAttribute("opacity", "0"); hideTip(); });
}

// ---- insight carousel ----------------------------------------------------------
function insights() {
  const d = state.data, t = d.totals, list = [];
  list.push({ big: Math.round(t.cacheHitRate * 100) + "%", text: `of prompt tokens came from cache <span class="muted">— repeated context is being reused rather than re-sent.</span>` });
  if (t.cacheSavings > 0) list.push({ big: money(t.cacheSavings, 0), text: `of input cost avoided by cache reads <span class="muted">(estimate, at each model's input rate).</span>` });
  const top = [...d.stack].filter((s) => !s.other).sort((a, b) => b.tokens.reduce((x, y) => x + y, 0) - a.tokens.reduce((x, y) => x + y, 0))[0];
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  if (top && t.tokens) list.push({ big: pctText(pct(sum(top.tokens), t.tokens)), text: `of tokens went to <b>${esc(stackLabel(top))}</b> <span class="muted">— the largest ${state.data.meta.group} in this range.</span>` });
  const busiest = d.byDay.slice().sort((a, b) => b.tokens - a.tokens)[0];
  if (busiest) list.push({ big: compact(busiest.tokens), text: `tokens on <b>${longDay(busiest.day)}</b> <span class="muted">— the busiest day, ${plural(busiest.messages, "message")} across ${plural(busiest.sessions, "session")}.</span>` });
  if (t.reasoning) list.push({ big: compact(t.reasoning), text: `reasoning tokens <span class="muted">— ${pctText(pct(t.reasoning, t.output || 1))} of output, counted inside output and never added to the total.</span>` });
  if (t.unpricedRows) list.push({ big: int(t.unpricedRows), text: `rows have no price <span class="muted">— their tokens are counted, their dollars are not. Add rates in prices.json.</span>` });
  return list;
}
function drawInsight() {
  const el = $("insight"), list = insights();
  state.insight = ((state.insight % list.length) + list.length) % list.length;
  const cur = list[state.insight];
  el.innerHTML = `<div><span class="label">Insight</span><div class="big">${cur.big}</div><p>${cur.text}</p></div>
    <div class="pager"><button class="icon-btn" data-step="-1" aria-label="Previous insight">‹</button>
    <div class="dotset">${list.map((_, i) => `<i class="${i === state.insight ? "on" : ""}"></i>`).join("")}</div>
    <button class="icon-btn" data-step="1" aria-label="Next insight">›</button></div>`;
  el.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => { state.insight += Number(b.dataset.step); drawInsight(); }));
}

// ---- heatmap -------------------------------------------------------------------
function drawHeat() {
  const d = state.data, el = $("heat");
  const key = state.metric === "cost" ? "cost" : state.metric === "messages" ? "messages" : "tokens";
  const end = new Date(d.heatmap.to + "T00:00:00Z");
  const WEEKS = 53, CELL = 13, GAP = 3, LEFT = 30, TOP = 16;
  const start = new Date(end);
  start.setUTCDate(start.getUTCDate() - end.getUTCDay() - (WEEKS - 1) * 7);
  const cells = [], values = [];
  for (let w = 0; w < WEEKS; w++) for (let dow = 0; dow < 7; dow++) {
    const dt = new Date(start); dt.setUTCDate(start.getUTCDate() + w * 7 + dow);
    if (dt > end) continue;
    const day = dt.toISOString().slice(0, 10), rec = d.heatmap.days[day], v = rec ? rec[key] : 0;
    if (v > 0) values.push(v);
    cells.push({ w, dow, day, v, rec });
  }
  values.sort((a, b) => a - b);
  const q = (p) => (values.length ? values[Math.min(values.length - 1, Math.floor(p * values.length))] : Infinity);
  const cuts = [q(0.25), q(0.5), q(0.75)];
  const level = (v, active) => (v <= 0 ? (active ? 1 : 0) : v < cuts[0] ? 1 : v < cuts[1] ? 2 : v < cuts[2] ? 3 : 4);
  const width = LEFT + WEEKS * (CELL + GAP), height = TOP + 7 * (CELL + GAP);
  let svg = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Activity by day over the last year">`, last = -1;
  for (let w = 0; w < WEEKS; w++) {
    const f = new Date(start); f.setUTCDate(start.getUTCDate() + w * 7);
    if (f.getUTCMonth() !== last && f.getUTCDate() <= 7) { svg += `<text x="${LEFT + w * (CELL + GAP)}" y="10">${f.toLocaleDateString("en-US", { month: "short", timeZone: "UTC" })}</text>`; last = f.getUTCMonth(); }
  }
  ["Mon", "Wed", "Fri"].forEach((n, i) => { svg += `<text x="0" y="${TOP + (i * 2 + 1) * (CELL + GAP) + CELL - 2}">${n}</text>`; });
  for (const c of cells) svg += `<rect class="cell" data-day="${c.day}" x="${LEFT + c.w * (CELL + GAP)}" y="${TOP + c.dow * (CELL + GAP)}" width="${CELL}" height="${CELL}" rx="3" fill="var(--heat-${level(c.v, (c.rec?.messages ?? 0) > 0)})"/>`;
  el.innerHTML = svg + "</svg>";
  const byDay = Object.fromEntries(cells.map((c) => [c.day, c]));
  el.addEventListener("pointermove", (ev) => {
    const day = ev.target.dataset?.day;
    if (!day) return hideTip();
    const c = byDay[day];
    showTip(`<div class="t">${longDay(day)}</div>` + (c.rec ? `<div class="r"><span>Tokens</span><b class="mono">${compact(c.rec.tokens)}</b></div><div class="r"><span>Cost</span><b class="mono">${money(c.rec.cost)}</b></div><div class="r"><span>Messages</span><b class="mono">${int(c.rec.messages)}</b></div>` : `<div class="muted">No usage</div>`), ev);
  });
  el.addEventListener("pointerleave", hideTip);
  el.scrollLeft = el.scrollWidth;
}

function drawTable() {
  const d = state.data, defs = tableDefs(d), card = $("tablecard");
  if (!defs[state.tab]) state.tab = "sessions";
  const def = defs[state.tab];
  const [sk, sd] = state.sort[state.tab] ?? def.defaultSort;
  const col = def.cols.find((c) => c.k === sk) ?? def.cols[0];
  const rows = def.rows.slice().sort((a, b) => {
    const x = col.val(a), y = col.val(b);
    const c = typeof x === "string" ? x.localeCompare(y) : x - y;
    return (c || 0) * sd;
  });
  const shown = rows.slice(0, state.shown);

  card.innerHTML = `<div class="tabs" role="tablist">${Object.entries(defs).map(([k, v]) => `<button role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${v.label}<span class="count">${int(v.count)}</span></button>`).join("")}
    <div class="tools"><button class="btn sm" id="csv"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>CSV</button></div></div>
    ${rows.length ? `<div class="table-wrap"><table><thead><tr>${def.cols.map((c) => `<th class="${c.left ? "l" : ""}" data-sort="${c.k}">${c.l}${c.k === sk ? `<span class="arr">${sd < 0 ? "↓" : "↑"}</span>` : ""}</th>`).join("")}</tr></thead>
    <tbody>${shown.map((r, i) => `<tr class="${r.thread ? "click" : ""}" data-i="${i}" ${r.thread ? `title="Open this conversation"` : ""}>${def.cols.map((c) => c.html(r)).join("")}</tr>`).join("")}</tbody></table></div>
    ${rows.length > shown.length ? `<div class="more"><button class="btn" id="more">Show ${Math.min(200, rows.length - shown.length)} more of ${int(rows.length - shown.length)}</button></div>` : ""}` : `<div class="empty">Nothing matches the current filters.</div>`}`;

  card.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { state.tab = b.dataset.tab; state.shown = 100; save(); drawTable(); }));
  card.querySelectorAll("th[data-sort]").forEach((th) => th.addEventListener("click", () => {
    const k = th.dataset.sort;
    state.sort[state.tab] = [k, k === sk ? -sd : (def.cols.find((c) => c.k === k).left ? 1 : -1)];
    drawTable();
  }));
  card.querySelector("#more")?.addEventListener("click", () => { state.shown += 200; drawTable(); });
  card.querySelector("#csv").addEventListener("click", () => exportCsv(def, rows));
  if (state.tab === "sessions") card.querySelectorAll("tr.click").forEach((tr) => tr.addEventListener("click", () => {
    const row = shown[Number(tr.dataset.i)];
    if (row?.thread) { state.view = "threads"; save(); openThread(row.thread.id); loadThreads(); render(); }
  }));
}

function exportCsv(def, rows) {
  const cols = def.cols.filter((c) => c.k !== "share");
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const text = [cols.map((c) => cell(c.l)).join(","), ...rows.map((r) => cols.map((c) => cell(c.val(r))).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
  a.download = `usage-${state.tab}-${state.data.meta.start}_${state.data.meta.end}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

    <div class="faint mono" id="tcount" style="padding:8px 14px;border-top:1px solid var(--line-2);font-size:11px">${list ? `${int(list.threads.length)} of ${int(list.total)}${list.ranked ? " · best match first" : " · newest first"}` : ""}</div></div>
    <div class="panel td" id="tdetail"></div></section>`;

  const tq = $("tq");
  tq.addEventListener("input", debounce(() => { t.q = tq.value; loadThreads().catch(() => {}); }, 280));
  $("tagent").addEventListener("change", (e) => { t.agent = e.target.value; loadThreads().catch(() => {}); });
  $("tsub").addEventListener("change", (e) => { t.sub = e.target.checked; loadThreads().catch(() => {}); });
  $("tlist").addEventListener("click", (e) => { const row = e.target.closest("[data-id]"); if (row) openThread(row.dataset.id); });
  renderThreadDetail();
}
function threadRows(list) {
  if (!list.threads.length) return `<div class="empty">No threads match.</div>`;
  return list.threads.map((x) => `<div class="ti ${x.id === state.thr.sel ? "on" : ""}" data-id="${esc(x.id)}">
    <span style="padding-top:2px">${icon(x.harness, 18)}</span><span class="t">${esc(x.title || x.preview || "(untitled)")}</span><span class="when">${x.updatedAt ? ago(x.updatedAt) : ""}</span>
    <span class="m"><span>${esc(tail(x.cwd, 2))}</span>${x.branch ? `<span class="mono">${esc(x.branch)}</span>` : ""}<span>${int(x.messages)} msgs</span>${x.subagent ? '<span class="pill">subagent</span>' : ""}</span></div>`).join("");
}
function refreshThreadList() {
  const t = state.thr, list = t.list;
  $("tlist").innerHTML = threadRows(list);
  const sel = $("tagent");
  sel.innerHTML = `<option value="all">All agents</option>` + list.harnesses.map((h) => `<option value="${esc(h)}">${esc(agentName(h))}</option>`).join("");
  sel.value = list.harnesses.includes(t.agent) ? t.agent : "all";
  sel.classList.toggle("on", sel.value !== "all");
  $("tcount").textContent = `${int(list.threads.length)} of ${int(list.total)}${list.ranked ? " · best match first" : " · newest first"}`;
  $("tsubl").textContent = `Subagents${list.hiddenSubagents ? ` (${int(list.hiddenSubagents)} hidden)` : ""}`;
}
const debounce = (fn, ms) => { let h; return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); }; };

// Minimal formatting: fenced code, inline code, otherwise plain text. No HTML is
// ever taken from a message; everything is escaped first.
function formatText(text) {
  return String(text).split(/```/).map((part, i) => {
    if (i % 2) { const nl = part.indexOf("\n"); return `<pre>${esc(nl >= 0 && nl < 20 ? part.slice(nl + 1) : part)}</pre>`; }
    const html = esc(part).replace(/`([^`\n]+)`/g, '<code class="i">$1</code>').trim();
    return html ? `<p>${html}</p>` : "";
  }).join("");
}
function blockHTML(b) {
  if (b.type === "text") return `<div class="body">${formatText(b.text)}</div>`;
  if (b.type === "thinking") return `<details class="blk"><summary>Reasoning</summary><pre>${esc(b.text)}</pre></details>`;
  if (b.type === "tool_call") return `<details class="blk"><summary><span class="pill">tool</span>${esc(b.name)}</summary><pre>${esc(b.input)}</pre></details>`;
  if (b.type === "tool_result") return `<details class="blk"><summary><span class="pill">result</span>${esc(b.text.split("\n")[0].slice(0, 100))}</summary><pre>${esc(b.text)}</pre></details>`;
  if (b.type === "patch") return b.files.map((f) => `<details class="blk"><summary><span class="pill">${esc(f.change)}</span>${esc(tail(f.path, 3))} <span class="faint">+${f.additions} -${f.deletions}</span></summary><pre>${esc(f.diff)}</pre></details>`).join("");
  return "";
}

function renderThreadDetail() {
  const t = state.thr, el = $("tdetail");
  if (!el) return;
  $("tlist")?.querySelectorAll(".ti").forEach((r) => r.classList.toggle("on", r.dataset.id === t.sel));
  if (!t.sel) { el.innerHTML = `<div class="empty">Pick a thread to read it.<br><span class="faint">Resume gives you the exact command; nothing is started from this page.</span></div>`; return; }
  const dt = t.detail;
  if (!dt) { el.innerHTML = `<div class="empty">Loading…</div>`; return; }
  if (dt.error) { el.innerHTML = `<div class="empty">${esc(dt.error)}</div>`; return; }
  const x = dt.thread;
  const tok = x.tokens ? x.tokens.input + x.tokens.output + x.tokens.cache_read + x.tokens.cache_write : 0;
  el.innerHTML = `<header><h2>${esc(x.title || "(untitled)")}</h2>
    <div class="facts"><span style="display:inline-flex;gap:6px;align-items:center">${icon(x.harness, 15)}<b>${esc(agentName(x.harness))}</b></span>${x.model ? `<span><b>${esc(x.model)}</b></span>` : ""}<span title="${esc(x.cwd)}">${esc(tail(x.cwd, 3))}</span>${x.branch ? `<span class="mono">${esc(x.branch)}</span>` : ""}<span>${int(x.messages)} messages</span>${tok ? `<span>${compact(tok)} tokens</span>` : ""}<span>started ${x.startedAt ? new Date(x.startedAt).toLocaleString("en-GB") : "?"}</span></div>
    <div class="actions"><button class="btn primary" id="resume">Resume</button><button class="btn" id="fork">Fork</button>
      <select class="field" id="cont" aria-label="Continue in another agent"><option value="">Continue in…</option></select>
      <button class="btn" id="copyid">Copy id</button></div>
    <div id="cmdbox">${t.cmd ? cmdHTML(t.cmd) : ""}</div></header>
    <div class="scroll"><div class="msgs">${dt.messages.map((m) => `<div class="msg ${m.role}"><div class="who"><span>${esc(m.role)}</span>${m.at ? `<span>${new Date(m.at).toLocaleTimeString("en-GB")}</span>` : ""}</div>${m.content.map(blockHTML).join("")}</div>`).join("")}
      ${dt.total > dt.offset + dt.messages.length ? `<div class="faint">Showing the first ${dt.messages.length} of ${int(dt.total)} messages. Read the rest with <code>atuin threads show ${esc(x.id.slice(-8))}</code>.</div>` : ""}</div></div>`;
  $("resume").addEventListener("click", () => resume(x, "resume"));
  $("fork").addEventListener("click", () => resume(x, "fork"));
  $("cont").addEventListener("change", (e) => { if (e.target.value) resume(x, e.target.value); e.target.value = ""; });
  $("copyid").addEventListener("click", () => copy(x.session));
}
const cmdHTML = (c) => `<div class="cmd"><code>${esc(c.text)}</code><button class="btn sm" data-copy>Copy</button></div>${c.note ? `<div class="faint" style="font-size:11.5px;margin-top:6px">${esc(c.note)}</div>` : ""}`;
async function resume(x, mode) {
  const t = state.thr;
  try {
    const r = await get("/api/threads/resume?id=" + encodeURIComponent(x.id));
    const targets = Object.keys(r.continueIn);
    const sel = $("cont");
    if (sel && sel.options.length === 1) targets.forEach((h) => sel.add(new Option(agentName(h), h)));
    if (mode === "resume") t.cmd = { text: r.resume, note: "Run this in a terminal on this machine. Nothing was started." };
    else if (mode === "fork") t.cmd = { text: r.fork, note: "Writes a new session with the same history and resumes it. The original is left alone." };
    else t.cmd = { text: r.continueIn[mode], note: `Writes the thread out as a new ${agentName(mode)} session and resumes it there.` };
    $("cmdbox").innerHTML = cmdHTML(t.cmd);
    $("cmdbox").querySelector("[data-copy]").addEventListener("click", (e) => { copy(t.cmd.text); e.target.textContent = "Copied"; setTimeout(() => (e.target.textContent = "Copy"), 1200); });
    copy(t.cmd.text);
  } catch (e) { $("cmdbox").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); } catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
}

// ==== wiring ====================================================================
const fail = (e) => { if (e.name !== "AbortError") $("main").innerHTML = `<div class="empty panel">Could not load: ${esc(e.message)}</div>`; };
const reloadUsage = () => loadUsage().catch(fail);
function setView(v) {
  state.view = v; save();
  if (v !== "threads") history.replaceState(null, "", location.pathname);
  render();
  if (v === "limits") loadLimits().catch(fail);
  if (v === "threads" && !state.thr.list) loadThreads().catch(fail);
  if (v === "usage" && !state.data) reloadUsage();
}
$("nav").addEventListener("click", (e) => { const v = e.target.closest("button")?.dataset.v; if (v) setView(v); });
$("range").addEventListener("click", (e) => { const v = e.target.closest("button")?.dataset.v; if (!v) return; state.range = v; save(); if (v === "custom" && state.data) { state.from = state.from || state.data.meta.start; state.to = state.to || state.data.meta.end; } controls(); if (v !== "custom" || (state.from && state.to)) reloadUsage(); });
$("main").addEventListener("click", (e) => { const b = e.target.closest("#group button"); if (b) { state.group = b.dataset.v; save(); reloadUsage(); } });
$("metric").addEventListener("click", (e) => { const v = e.target.closest("button")?.dataset.v; if (v) { state.metric = v; save(); controls(); if (state.data) renderUsage(); } });
for (const k of ["host", "agent", "project", "model"]) $("f-" + k).addEventListener("change", (e) => { state[k] = e.target.value; state.shown = 100; reloadUsage(); });
$("q").addEventListener("input", debounce((e) => { state.q = e.target.value; state.shown = 100; reloadUsage(); }, 250));
for (const id of ["from", "to"]) $(id).addEventListener("change", (e) => { state[id] = e.target.value; if (state.from && state.to && state.from <= state.to) { state.range = "custom"; save(); reloadUsage(); } });
$("refresh").addEventListener("click", async () => {
  const b = $("refresh"); b.classList.add("spin");
  try { if (state.view === "limits") await loadLimits(true); else if (state.view === "threads") await loadThreads(true); else await loadUsage(true); } catch (e) { fail(e); } finally { b.classList.remove("spin"); }
});
let resizeTimer;
new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (state.view === "usage" && state.data && $("chart")) drawChart(); }, 120); }).observe(document.body);
setInterval(() => {
  if (document.hidden) return;
  if (state.view === "usage") reloadUsage();
  else if (state.view === "limits") loadLimits().catch(() => {});
}, 60000);

const hash = /^#threads\/([\w-]+)$/.exec(location.hash);
if (hash) { state.view = "threads"; state.thr.sel = hash[1]; openThread(hash[1]); }
setView(state.view);
</script>
</body>
</html>
