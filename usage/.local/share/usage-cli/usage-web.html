      const names = [...new Set(run.map((r) => r.name).filter(Boolean))].slice(0, 4).join(", ");
      out.push(`<details class="run"><summary>${ui("list", 14)}<span class="l"><b>${run.length} steps</b>${names ? ` <span class="faint">${esc(names)}</span>` : ""}</span><span class="at mono">${clock(run.at(-1).at)}</span>${ui("chevron-right", 12)}</summary><div class="steps">${run.map((r) => r.html).join("")}</div></details>`);
    } else out.push(`<div class="steps">${run.map((r) => r.html).join("")}</div>`);
    run = [];
  };
  for (const m of messages) for (const b of m.content) {
    if (b.type === "text") {
      if (!b.text.trim()) continue;
      const html = renderText(b.text, m.role);
      if (!html) continue;
      flush();
      if (m.role === "user") out.push(`<div class="turn user" data-at="${esc(m.at ?? "")}"><div class="bubble"><div class="body">${html}</div></div>${msgMeta(b.text, m.at)}</div>`);
      else if (m.role === "assistant") out.push(`<div class="turn assistant" data-at="${esc(m.at ?? "")}"><div class="say body">${html}</div>${msgMeta(b.text, m.at)}</div>`);
      else out.push(`<div class="sys body"><span class="role">${esc(m.role)}</span>${html}</div>`); // system, developer and the like
    } else if (b.type === "summary") { flush(); out.push(`<details class="mdd wrap"><summary>Conversation summary</summary><div class="wb">${renderText(b.text, "system")}</div></details>`); }
    else if (b.type === "error") { flush(); out.push(`<div class="errline">${ui("x", 13)}<span>${esc(b.text)}</span></div>`); }
    else if (b.type === "tool_result" && b.id && used.has(b.id)) continue;

      const html = stepHTML(b, m.at, res);
      if (!html) continue;
      if (b.type === "tool_call" && toolKind(b.name) === "ask" && Array.isArray(b.args?.questions)) { flush(); out.push(html); continue; }

      folder.textContent = done.opened === "zed" ? (done.host ? "opening in Zed over ssh" : "opened in Zed") : "opened";
    } catch (e) { folder.textContent = /Install Zed/.test(e.message) ? "needs Zed" : /not on this machine|none of the other/.test(e.message) ? "not found on any machine" : "could not open"; folder.title = e.message; }
    setTimeout(() => { delete folder.dataset.busy; if (folder.isConnected) folder.textContent = was; }, 1500);
  });
  // Branch and repository: the origin remote of that folder, turned into a web address. Only the
  // machine that has the folder can answer, so on another machine these stay plain text.
  if (x.cwd) {
    const r = t.repo?.id === x.id && t.repo.branch === x.branch ? t.repo : (t.repo = { id: x.id, branch: x.branch, p: get("/api/threads/repo?id=" + encodeURIComponent(x.id) + (x.branch ? "&branch=" + encodeURIComponent(x.branch) : "")).catch(() => null) });
    r.p.then((info) => {
      if (state.thr.sel !== x.id || !$("brlink")) return;
      const set = (el, href, text, tip) => { if (text) el.textContent = text; el.title = tip; if (href) { el.href = href; el.target = "_blank"; el.rel = "noopener noreferrer"; el.removeAttribute("aria-disabled"); } };
      if (!info) { $("brlink").title = $("repolink").title = "That folder is not on this machine"; return; }
      set($("brlink"), info.branchUrl, info.branch && !x.branch ? info.branch : "", info.branchUrl ? `Open branch ${x.branch || info.branch} on the web` : "This repository has no web address");
      set($("repolink"), info.web, info.name || "none", info.web ? `Open ${info.web}` : "This folder has no remote called origin");
      if (!info.web) $("repolink").setAttribute("aria-disabled", "true");
    });
  }
  $("resume").addEventListener("click", (e) => copyCmd(e.currentTarget, `${ui("check", 13)}<span>Copied</span>`));
  $("cmdbox").addEventListener("click", (e) => copyCmd(e.currentTarget.querySelector(".ui"), UI.check));
  $("rmode").addEventListener("click", (e) => { const v = e.target.closest("button")?.dataset.v; if (v) { t.mode = v; resume(threadBrief()); } });
  $("cont").addEventListener("change", (e) => { if (e.target.value) { t.mode = e.target.value; resume(threadBrief()); } });
  resume(x);
}
// The command wraps inside a box of fixed height (three lines, then cut), so a
// long path never changes the panel; the tooltip and the copy carry all of it.
async function resume(x) {
  const t = state.thr;
  try {
    // One request per thread, shared by every caller: the panel can be redrawn
    // while it is in flight, and the answer must land in the element on screen.
    if (t.cmds?.id !== x.id) t.cmds = { id: x.id, p: get("/api/threads/resume?id=" + encodeURIComponent(x.id)) };
    const r = await t.cmds.p;
    const code = $("cmdtext"), note = $("cmdnote"), sel = $("cont");
    if (state.thr.sel !== x.id || !code) return;
    if (sel.options.length === 1) Object.keys(r.continueIn).forEach((h) => sel.add(new Option(agentName(h), h)));
    const mode = t.mode in r.continueIn || ["resume", "fork"].includes(t.mode) ? t.mode : "resume";
    const [text, why] = mode === "resume" ? [r.resume, r.asIs ? "This thread also went on elsewhere. The command resumes this machine's copy as it is; Fork keeps both." : "Run it in a terminal on this machine. Nothing is started from this page."]
      : mode === "fork" ? [r.fork, "Writes a new session with the same history and resumes it. The original is left alone."]
      : [r.continueIn[mode], `Writes the thread out as a new ${agentName(mode)} session and resumes it there.`];
    t.cmd = { text };
    code.textContent = text; $("cmdbox").title = "Copy: " + text; note.textContent = why;
    sel.value = ["resume", "fork"].includes(mode) ? "" : mode; sel.classList.toggle("on", Boolean(sel.value));
    for (const b of $("rmode").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.v === mode));
  } catch (e) {
    t.cmds = null; t.cmd = null;
    const code = $("cmdtext"), note = $("cmdnote");
    if (code) { code.textContent = "No command for this thread"; note.textContent = e.message.split("\n")[0]; }
  }
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); } catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
}

function modelRows(filtered = true) {
  const d = state.mod.data, byId = new Map(d.catalog.map((c) => [c.id, c])), rows = [], usedIds = new Map();
  for (const u of d.used) {
    const c = u.catalogId ? byId.get(u.catalogId) : null;
    if (c) usedIds.set(c.id, (usedIds.get(c.id) ?? 0) + 1);
    rows.push({ key: "u:" + u.model, name: u.model, vendor: c?.vendor ?? guessVendor(u.model), c, u });
  }
  if (!filtered || state.mod.scope === "all") for (const c of d.catalog) if (!usedIds.has(c.id)) rows.push({ key: "c:" + c.id, name: c.id, vendor: c.vendor, c, u: null });
  if (!filtered) return rows;
  const words = state.mod.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return words.length ? rows.filter((r) => words.every((w) => `${r.name} ${r.c?.name ?? ""} ${r.vendor}`.toLowerCase().includes(w))) : rows;

// Head to head: the ticked models side by side, one row per figure, with the best
// value in each row marked. "low" rows (prices, cost) are won by the smaller number.
const H2H_MAX = 5;
const H2H_ROWS = [

  ["Benchmarks", [

  ]],

function drawModelHead() {
  const M = state.mod, el = $("mh2h");
  if (!el) return;
  const byKey = new Map(modelRows(false).map((r) => [r.key, r]));
  const all = [...M.picked].map((k) => byKey.get(k)).filter(Boolean), cols = all.slice(0, H2H_MAX);
  const head = `<div class="h2hhead"><h2>Head to head</h2>${M.picked.size ? `<button class="btn sm" id="h2hclear">Clear ${M.picked.size} ticked</button>` : ""}</div>`;
  const wire = () => el.querySelector("#h2hclear")?.addEventListener("click", clearPicks);
  if (cols.length < 2) {
    el.innerHTML = `${head}<div class="h2hhint">Tick ${cols.length ? "one more model" : "two to five models"} in the table below to compare them side by side.</div>`;
    wire();
    return;
  }
  const wins = cols.map(() => 0), body = [];
  for (const [group, metrics] of H2H_ROWS) {
    const lines = [];
    for (const [label, val, fmt, better] of metrics) {
      const vals = cols.map(val).map((v) => (v == null || !Number.isFinite(v) ? null : v));
      if (vals.every((v) => v == null)) continue;
      const have = vals.filter((v) => v != null);
      const top = better && have.length > 1 ? (better === "low" ? Math.min(...have) : Math.max(...have)) : null;
      // Judge on what is shown, so 98% against 98% is a tie even if the raw numbers differ.
      const leaders = top == null ? [] : vals.flatMap((v, i) => (v != null && String(fmt(v)) === String(fmt(top)) ? [i] : []));
      const decided = leaders.length > 0 && leaders.length < have.length; // all equal is a tie, nobody leads
      if (decided && leaders.length === 1) wins[leaders[0]] += 1;
      lines.push(`<tr><td>${label}</td>${vals.map((v, i) => `<td class="${decided && leaders.includes(i) ? "best" : ""}">${v == null ? '<span class="none-v">-</span>' : fmt(v)}</td>`).join("")}</tr>`);
    }
    if (lines.length) body.push(`<tr class="grp"><td colspan="${cols.length + 1}">${group.replace("{cur}", fxActive())}</td></tr>`, ...lines);
  }
  const flag = (label, test) => `<tr><td>${label}</td>${cols.map((r) => `<td>${test(r) ? "yes" : '<span class="none-v">no</span>'}</td>`).join("")}</tr>`;
  const most = Math.max(...wins), soleLeader = most > 0 && wins.filter((w) => w === most).length === 1;
  el.innerHTML = `${head}<div class="h2h"><table>
    <thead><tr><th></th>${cols.map((r) => `<th><div class="nm">${vi(r.vendor, 15, r)}<span class="t" title="${esc(r.c?.name ?? r.name)}">${esc(r.name.replace(/^[^/]+\//, ""))}</span></div>${r.c?.created ? `<span class="sub mono">released ${esc(r.c.created)}</span>` : ""}</th>`).join("")}</tr></thead>
    <tbody>
      <tr class="tally"><td>Rows won</td>${wins.map((w) => `<td class="${soleLeader && w === most ? "best" : ""}">${w}</td>`).join("")}</tr>
      ${body.join("")}
      <tr class="grp"><td colspan="${cols.length + 1}">Features</td></tr>
      ${flag("Reasoning", (r) => r.c?.reasoning)}${flag("Image input", (r) => r.c?.inputs?.includes("image"))}
    </tbody></table></div>
    ${all.length > cols.length ? `<div class="h2hhint">Showing the first ${H2H_MAX} of ${all.length} ticked models.</div>` : ""}`;
  wire();
}

function drawModelBars() {
  const M = state.mod, [, , val, fmt] = MODEL_METRICS.find((m) => m[0] === M.metric);

  rows = rows.map((r) => [r, val(r)]).filter((x) => x[1] != null && Number.isFinite(x[1])).sort((a, b) => b[1] - a[1]).slice(0, 14);
  const max = Math.max(...rows.map((x) => x[1]), 0) || 1;
  // Elo sits in a narrow band far from zero, so those bars start at a floor.
  const floor = M.metric.startsWith("arena") && rows.length ? Math.min(...rows.map((x) => x[1])) - 60 : 0;
  $("mbars").innerHTML = rows.length ? `<div class="hbars">${rows.map(([r, v]) => `<div class="hbar ${r.u ? "used" : ""}"><span class="n">${vi(r.vendor, 14, r)}<b title="${esc(r.name)}">${esc(r.name.replace(/^[^/]+\//, ""))}</b></span><span class="tr"><i style="width:${Math.max(1.5, ((v - floor) / (max - floor || 1)) * 100)}%"></i></span><span class="v">${fmt(v)}</span></div>`).join("")}</div>`

function drawModelScatter() {
  const el = $("mscatter"), M = state.mod, d = M.data;
  const usedIds = new Set(d.used.map((u) => u.catalogId).filter(Boolean));
  const pickedIds = new Set(modelRows().filter((r) => M.picked.has(r.key) && r.c).map((r) => r.c.id));
  const pts = d.catalog.filter((c) => c.bench?.intelligence != null && c.price?.output > 0);
  if (!pts.length) { el.innerHTML = `<div class="empty">No benchmark data cached.</div>`; return; }
  const W = Math.max(420, el.clientWidth), H = Math.max(280, Math.min(520, Math.round(W * 0.22))), L = 40, R = 12, T = 10, B = 30, pw = W - L - R, ph = H - T - B;
  const xs = pts.map((c) => Math.log10(c.price.output)), x0 = Math.floor(Math.min(...xs)), x1 = Math.ceil(Math.max(...xs));
  const ys = pts.map((c) => c.bench.intelligence), y0 = Math.floor(Math.min(...ys) / 10) * 10, y1 = Math.ceil(Math.max(...ys) / 10) * 10;
  const X = (c) => L + ((Math.log10(c.price.output) - x0) / (x1 - x0 || 1)) * pw, Y = (c) => T + ph - ((c.bench.intelligence - y0) / (y1 - y0 || 1)) * ph;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Intelligence index against output price"><g class="axis">`;
  for (let e = x0; e <= x1; e++) { const xx = L + ((e - x0) / (x1 - x0 || 1)) * pw; svg += `<line class="gridline" x1="${xx}" x2="${xx}" y1="${T}" y2="${T + ph}"/><text x="${xx}" y="${H - 12}" text-anchor="middle">$${e < 0 ? (10 ** e).toFixed(-e) : 10 ** e}</text>`; }
  for (let v = y0; v <= y1; v += 10) { const yy = T + ph - ((v - y0) / (y1 - y0 || 1)) * ph; svg += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end">${v}</text>`; }
  svg += `<text x="${W - R}" y="${H - 1}" text-anchor="end">output USD per 1M tokens, log scale</text></g>`;
  const rank = (c) => (pickedIds.has(c.id) ? 2 : usedIds.has(c.id) ? 1 : 0);
  for (const c of pts.slice().sort((a, b) => rank(a) - rank(b))) {
    const k = rank(c);
    svg += `<circle data-id="${esc(c.id)}" cx="${X(c)}" cy="${Y(c)}" r="${k ? 5 : 3}" fill="${k === 2 ? "var(--c4)" : k ? "var(--accent)" : "var(--faint)"}" opacity="${k ? 1 : 0.55}" stroke="var(--bg)" stroke-width="1"/>`;
    if (k) svg += `<text x="${X(c) + 8}" y="${Y(c) + 3}" style="fill:var(--text);font-size:10.5px;font-family:var(--sans)" text-anchor="${X(c) > W - 150 ? "end" : "start"}" ${X(c) > W - 150 ? `dx="-16"` : ""}>${esc(c.id.replace(/^[^/]+\//, ""))}</text>`;
  }
  el.innerHTML = svg + "</svg>";
  const byId = new Map(pts.map((c) => [c.id, c]));
  el.onpointermove = (ev) => {
    const c = byId.get(ev.target.dataset?.id);
    if (!c) return hideTip();
    showTip(`<div class="t">${esc(c.name)}</div><div class="r"><span>Intelligence</span><b class="mono">${c.bench.intelligence.toFixed(1)}</b></div><div class="r"><span>Output</span><b class="mono">${money(c.price.output)}</b></div><div class="r"><span>Input</span><b class="mono">${money(c.price.input ?? 0)}</b></div><div class="r"><span>Context</span><b class="mono">${c.context ? compact(c.context) : "-"}</b></div>`, ev);
  };
  el.onpointerleave = hideTip;
}

// change event keeps working. These draw the button and the popup (see the CSS above).
const XS = { pop: null, scrim: null, owner: null, closeT: null };
const xsChevron = () => ui("chevron-down", 13);
const xsMobile = () => innerWidth < 640;

function xsClose(immediate = false) {
  const { pop, scrim, owner } = XS;
  if (!pop) return;
  XS.pop = XS.scrim = XS.owner = null;
  owner?.setAttribute("aria-expanded", "false");
  document.removeEventListener("pointerdown", xsOutside, true);
  removeEventListener("resize", xsReflow); removeEventListener("scroll", xsOnScroll, true);
  if (immediate || reduced()) { pop.remove(); scrim?.remove(); return; }
  pop.classList.add("out"); scrim?.classList.add("out");
  setTimeout(() => { pop.remove(); scrim?.remove(); }, 140);
}
const xsOutside = (e) => { if (XS.pop && !XS.pop.contains(e.target) && !XS.owner?.contains(e.target)) xsClose(); };
const xsOnScroll = (e) => { if (XS.pop && !XS.pop.contains(e.target)) xsClose(); };
const xsReflow = () => { if (XS.pop && XS.owner) xsPlace(XS.pop, XS.owner); };

// Under the button when there is room, over it when there is not, always inside the window.
function xsPlace(pop, anchor) {
  if (pop.classList.contains("sheet")) return;
  const a = anchor.getBoundingClientRect(), gap = 6, edge = 8;
  pop.style.minWidth = Math.max(160, a.width) + "px";
  const w = pop.offsetWidth, h = pop.offsetHeight;
  const below = innerHeight - a.bottom - gap - edge, above = a.top - gap - edge;
  const up = h > below && above > below;
  const left = Math.max(edge, Math.min(a.left, innerWidth - w - edge));
  pop.style.left = left + "px";
  pop.style.top = (up ? Math.max(edge, a.top - gap - Math.min(h, above)) : a.bottom + gap) + "px";
  pop.style.setProperty("--ox", Math.max(0, Math.min(w, a.left + a.width / 2 - left)) + "px");
  pop.style.setProperty("--oy", up ? "100%" : "0");
  const list = pop.querySelector(".xs-list");
  if (list) list.style.maxHeight = Math.max(120, Math.min(320, (up ? above : below) - (pop.querySelector(".xs-q") ? 48 : 12))) + "px";
}

function xsOpenPop(anchor, build) {
  xsClose(true);
  clearTimeout(XS.closeT);
  const pop = document.createElement("div");
  pop.className = "xs-pop"; pop.setAttribute("role", "dialog");
  const sheet = xsMobile();
  if (sheet) { pop.classList.add("sheet"); const scrim = document.createElement("div"); scrim.className = "xs-scrim"; scrim.addEventListener("pointerdown", () => xsClose()); document.body.append(scrim); XS.scrim = scrim; }
  pop.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); const o = XS.owner; xsClose(); o?.focus(); } });
  build(pop);
  document.body.append(pop);
  XS.pop = pop; XS.owner = anchor; anchor.setAttribute("aria-expanded", "true");
  xsPlace(pop, anchor);
  document.addEventListener("pointerdown", xsOutside, true);
  addEventListener("resize", xsReflow); addEventListener("scroll", xsOnScroll, true);
  return pop;
}

// ---- select ------------------------------------------------------------------------------
function enhanceSelect(sel) {
  if (sel.dataset.xs || sel.multiple) return;
  sel.dataset.xs = "1";
  const pick = Boolean(sel.closest(".pick")), mode = Boolean(sel.closest(".modes"));
  const btn = document.createElement("button");
  btn.type = "button"; btn.setAttribute("role", "combobox"); btn.setAttribute("aria-haspopup", "listbox"); btn.setAttribute("aria-expanded", "false");
  btn.className = "xs" + (sel.classList.contains("field") ? " field" : "") + (pick ? " xs-pick" : "");
  btn.id = sel.id ? sel.id + "-xs" : "";
  sel.classList.add("xs-native"); sel.tabIndex = -1; sel.setAttribute("aria-hidden", "true");
  sel.after(btn);
  const options = () => [...sel.options];
  const sync = () => {
    const opts = options(), cur = opts[sel.selectedIndex];
    const widest = opts.reduce((a, o) => (o.text.length > a.length ? o.text : a), "");
    const label = esc(cur?.text ?? "");
    const sig = widest + "\u0001" + label + "\u0001" + sel.disabled + sel.title;
    if (btn._sig !== sig) {
      btn._sig = sig;
      btn.innerHTML = `<span class="xl"><span class="sz" aria-hidden="true">${esc(widest)}</span><span class="cur">${label}</span></span>${xsChevron()}`;
    }
    btn.disabled = sel.disabled; btn.title = sel.title || "";
    btn.classList.toggle("on", sel.classList.contains("on"));
    const name = sel.getAttribute("aria-label"); if (name) btn.setAttribute("aria-label", `${name}: ${cur?.text ?? ""}`);
  };
  new MutationObserver(sync).observe(sel, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "disabled", "title"], characterData: true });
  sel.addEventListener("change", sync);
  // Code sets select.value directly in many places; keep the button in step with that.
  const desc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, "value");
  Object.defineProperty(sel, "value", { configurable: true, get() { return desc.get.call(this); }, set(v) { desc.set.call(this, v); sync(); } });
  sync();

  const open = () => {
    const opts = options();
    const searchable = opts.length > 10;
    let active = Math.max(0, sel.selectedIndex), typed = "", typedAt = 0;
    const pop = xsOpenPop(btn, (pop) => {
      pop.setAttribute("aria-label", sel.getAttribute("aria-label") || "Options");
      pop.innerHTML = `${searchable ? '<input class="xs-q" type="text" placeholder="Search" aria-label="Search options" autocomplete="off" spellcheck="false">' : ""}<div class="xs-list" role="listbox" tabindex="-1"></div>`;
    });
    const list = pop.querySelector(".xs-list"), q = pop.querySelector(".xs-q");
    let shown = [];
    const draw = () => {
      const words = (q?.value ?? "").toLowerCase().split(/\s+/).filter(Boolean);
      // Every word has to match; the best matches come first, the rest keep their order.
      shown = opts.map((o, i) => {
        const hay = o.text.toLowerCase(), hw = hay.match(/[a-z0-9]+/g) ?? [];
        let score = 0;
        for (const w of words) { const x = fzWord(w, hay, hw); if (!x) { score = -1; break; } score += x; }
        return { o, i, score: words.length ? score : 0 };
      }).filter((x) => x.score >= 0);
      if (words.length) shown.sort((a, b) => b.score - a.score || a.i - b.i);
      if (active >= shown.length) active = Math.max(0, shown.length - 1);
      let lastGroup = null;
      list.innerHTML = shown.length ? shown.map(({ o, i }, n) => {
        const g = o.parentElement?.tagName === "OPTGROUP" ? o.parentElement.label : null;
        const head = g && g !== lastGroup ? `<div class="xs-grp">${esc(g)}</div>` : ""; lastGroup = g;
        return `${head}<div class="xs-it ${n === active ? "act" : ""}" role="option" id="xo${n}" data-n="${n}" aria-selected="${i === sel.selectedIndex}"><span class="ck">${ui("check", 14)}</span><span class="t">${esc(o.text)}</span></div>`;
      }).join("") : '<div class="xs-none">Nothing matches</div>';
      (q ?? list).setAttribute("aria-activedescendant", "xo" + active);
      list.querySelector(".act")?.scrollIntoView({ block: "nearest" });
    };
    const choose = (n) => {
      const hit = shown[n]; if (!hit) return;
      const changed = sel.selectedIndex !== hit.i;
      sel.selectedIndex = hit.i; sync();
      xsClose(); btn.focus();
      if (changed) sel.dispatchEvent(new Event("change", { bubbles: true }));
    };
    const move = (d) => { active = Math.max(0, Math.min(shown.length - 1, active + d)); list.querySelectorAll(".xs-it").forEach((el) => el.classList.toggle("act", Number(el.dataset.n) === active)); list.querySelector(".act")?.scrollIntoView({ block: "nearest" }); (q ?? list).setAttribute("aria-activedescendant", "xo" + active); };
    const keys = (e) => {
      if (e.key === "ArrowDown") { move(1); e.preventDefault(); }
      else if (e.key === "ArrowUp") { move(-1); e.preventDefault(); }
      else if (e.key === "Home") { move(-1e6); e.preventDefault(); }
      else if (e.key === "End") { move(1e6); e.preventDefault(); }
      else if (e.key === "PageDown") { move(8); e.preventDefault(); }
      else if (e.key === "PageUp") { move(-8); e.preventDefault(); }
      else if (e.key === "Enter") { choose(active); e.preventDefault(); }
      else if (e.key === "Tab") xsClose();
      else if (!q && e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
        // Type-ahead without a search box: jump to the next label that starts with what was typed.
        const now = performance.now(); typed = now - typedAt < 700 ? typed + e.key.toLowerCase() : e.key.toLowerCase(); typedAt = now;
        const at = shown.findIndex(({ o }) => o.text.toLowerCase().startsWith(typed));
        if (at >= 0) { active = at; move(0); }
      }
    };
    list.addEventListener("keydown", keys); q?.addEventListener("keydown", keys);
    q?.addEventListener("input", () => { active = 0; draw(); xsPlace(pop, btn); });
    list.addEventListener("click", (e) => { const it = e.target.closest(".xs-it"); if (it) choose(Number(it.dataset.n)); });
    list.addEventListener("pointermove", (e) => { const it = e.target.closest(".xs-it"); if (it && Number(it.dataset.n) !== active) { active = Number(it.dataset.n); move(0); } });
    draw(); xsPlace(pop, btn);
    (q ?? list).focus({ preventScroll: true });
  };
  btn.addEventListener("click", () => (XS.owner === btn ? xsClose() : open()));
  btn.addEventListener("keydown", (e) => { if (["ArrowDown", "ArrowUp", "Enter", " "].includes(e.key)) { e.preventDefault(); e.stopPropagation(); open(); } });
}

// ---- date --------------------------------------------------------------------------------
const pad2 = (n) => String(n).padStart(2, "0");
const isoOf = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fromIso = (v) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const dateLabel = (v) => { const d = fromIso(v); return d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "Pick a date"; };

function enhanceDate(inp) {
  if (inp.dataset.xs) return; inp.dataset.xs = "1";
  const btn = document.createElement("button");
  btn.type = "button"; btn.id = inp.id ? inp.id + "-xs" : ""; btn.className = "xs field date"; btn.setAttribute("aria-haspopup", "dialog"); btn.setAttribute("aria-expanded", "false");
  inp.classList.add("xs-native"); inp.tabIndex = -1; inp.setAttribute("aria-hidden", "true");
  inp.after(btn);
  const sync = () => {
    btn.innerHTML = `<span class="xl"><span class="sz" aria-hidden="true">30 Sep 2026</span><span class="cur">${esc(dateLabel(inp.value))}</span></span>${ui("calendar", 14)}`;
    btn.setAttribute("aria-label", `${inp.getAttribute("aria-label") || "Date"}: ${dateLabel(inp.value)}`);
  };
  const desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
  Object.defineProperty(inp, "value", { configurable: true, get() { return desc.get.call(this); }, set(v) { desc.set.call(this, v); sync(); } });
  inp.addEventListener("change", sync);
  sync();
  const other = () => $(inp.id === "from" ? "to" : "from");
  btn.addEventListener("click", () => (XS.owner === btn ? xsClose() : openCal()));
  btn.addEventListener("keydown", (e) => { if (["ArrowDown", "Enter", " "].includes(e.key)) { e.preventDefault(); e.stopPropagation(); openCal(); } });

  function openCal() {
    const picked = fromIso(inp.value) ?? new Date(), mate = fromIso(other()?.value), today = new Date();
    let view = new Date(picked.getFullYear(), picked.getMonth(), 1), focus = new Date(picked.getFullYear(), picked.getMonth(), picked.getDate()), level = "days";
    const pop = xsOpenPop(btn, (p) => { p.classList.add("cal"); p.setAttribute("aria-label", "Choose a date"); });
    const lo = inp.id === "to" ? mate : fromIso(inp.value), hi = inp.id === "to" ? fromIso(inp.value) : mate;
    const render = () => {
      const monthName = view.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
      let body;
      if (level === "months") {
        body = `<div class="cal-m cal-v">${Array.from({ length: 12 }, (_, m) => `<button type="button" data-m="${m}" class="${m === picked.getMonth() && view.getFullYear() === picked.getFullYear() ? "sel" : ""}">${new Date(2000, m, 1).toLocaleDateString("en-GB", { month: "short" })}</button>`).join("")}</div>`;
      } else {
        const first = new Date(view.getFullYear(), view.getMonth(), 1), offset = (first.getDay() + 6) % 7; // weeks start on Monday
        const start = new Date(first.getFullYear(), first.getMonth(), 1 - offset);
        const cells = Array.from({ length: 42 }, (_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
        const wd = Array.from({ length: 7 }, (_, i) => new Date(2024, 0, 1 + i).toLocaleDateString("en-GB", { weekday: "narrow" }));
        body = `<div class="cal-w">${wd.map((w) => `<span>${w}</span>`).join("")}</div><div class="cal-d cal-v" role="grid">${cells.map((d) => {
          const iso = isoOf(d), cls = [d.getMonth() !== view.getMonth() ? "out" : "", iso === isoOf(today) ? "today" : "", iso === inp.value ? "sel" : "", lo && hi && d > lo && d < hi ? "inr" : ""].filter(Boolean).join(" ");
          return `<button type="button" class="${cls}" data-d="${iso}" tabindex="${iso === isoOf(focus) ? 0 : -1}" aria-label="${d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}" ${iso === inp.value ? 'aria-pressed="true"' : ""}>${d.getDate()}</button>`;
        }).join("")}</div>`;
      }
      pop.innerHTML = `<div class="cal-h"><button type="button" class="nav" data-nav="-1" aria-label="${level === "months" ? "Previous year" : "Previous month"}">${ui("chevron-left", 15)}</button><button type="button" class="ttl" data-level>${level === "months" ? view.getFullYear() : esc(monthName)}</button><button type="button" class="nav" data-nav="1" aria-label="${level === "months" ? "Next year" : "Next month"}">${ui("chevron-right", 15)}</button></div>${body}<div class="cal-f"><button type="button" data-today>Today</button><button type="button" data-close>Close</button></div>`;
      xsPlace(pop, btn);
    };
    const pick = (iso) => { inp.value = iso; xsClose(); btn.focus(); inp.dispatchEvent(new Event("change", { bubbles: true })); };
    pop.addEventListener("click", (e) => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.d) pick(t.dataset.d);
      else if (t.dataset.nav) { view = level === "months" ? new Date(view.getFullYear() + +t.dataset.nav, view.getMonth(), 1) : new Date(view.getFullYear(), view.getMonth() + +t.dataset.nav, 1); focus = new Date(view.getFullYear(), view.getMonth(), Math.min(focus.getDate(), 28)); render(); }
      else if ("level" in t.dataset) { level = level === "days" ? "months" : "days"; render(); }
      else if (t.dataset.m) { view = new Date(view.getFullYear(), +t.dataset.m, 1); focus = new Date(view.getFullYear(), view.getMonth(), 1); level = "days"; render(); pop.querySelector(".cal-d button[tabindex='0']")?.focus(); }
      else if ("today" in t.dataset) pick(isoOf(new Date()));
      else if ("close" in t.dataset) { xsClose(); btn.focus(); }
    });
    // Arrow keys walk the days, PageUp and PageDown change the month, Enter picks.
    pop.addEventListener("keydown", (e) => {
      if (level !== "days" || !e.target.closest(".cal-d")) return;
      const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
      if (step) { focus = new Date(focus.getFullYear(), focus.getMonth(), focus.getDate() + step); view = new Date(focus.getFullYear(), focus.getMonth(), 1); render(); pop.querySelector(`.cal-d button[data-d="${isoOf(focus)}"]`)?.focus(); e.preventDefault(); }
      else if (e.key === "PageDown" || e.key === "PageUp") { const d = e.key === "PageDown" ? 1 : -1; const dim = new Date(focus.getFullYear(), focus.getMonth() + d + 1, 0).getDate(); focus = new Date(focus.getFullYear(), focus.getMonth() + d, Math.min(focus.getDate(), dim)); view = new Date(focus.getFullYear(), focus.getMonth(), 1); render(); pop.querySelector(`.cal-d button[data-d="${isoOf(focus)}"]`)?.focus(); e.preventDefault(); }
    });
    render();
    pop.querySelector(".cal-d button[tabindex='0']")?.focus({ preventScroll: true });
  }
}

// Search fields: a clear button that appears when there is something to clear, a shortcut hint that
// shows while the field is empty and idle, and the browser's own tiny cancel cross hidden.
function enhanceSearch(label) {
  if (label.dataset.xs) return; label.dataset.xs = "1";
  const input = label.querySelector("input"); if (!input) return;
  const clear = document.createElement("button"), hint = document.createElement("span");
  clear.type = "button"; clear.className = "sclear"; clear.setAttribute("aria-label", "Clear search"); clear.title = "Clear (Esc)"; clear.innerHTML = ui("x", 12); clear.tabIndex = -1;
  hint.className = "skbd"; hint.setAttribute("aria-hidden", "true"); hint.textContent = "Ctrl F";
  label.append(clear, hint);
  const sync = () => label.classList.toggle("has", input.value.length > 0);
  input.addEventListener("input", sync);
  clear.addEventListener("click", () => { input.value = ""; sync(); input.dispatchEvent(new Event("input", { bubbles: true })); input.focus(); });
  const desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
  Object.defineProperty(input, "value", { configurable: true, get() { return desc.get.call(this); }, set(v) { desc.set.call(this, v); sync(); } });
  sync();
}
function enhanceWidgets(root = document) {
  root.querySelectorAll?.("label.search:not([data-xs])").forEach(enhanceSearch);
  if (root.matches?.("label.search:not([data-xs])")) enhanceSearch(root);
  root.querySelectorAll?.("select:not([data-xs])").forEach(enhanceSelect);
  root.querySelectorAll?.('input[type="date"]:not([data-xs])').forEach(enhanceDate);
}
// ---- tooltips ---------------------------------------------------------------------------------------
// One bubble for the whole page, in place of the browser's own. Any element with a title gets it: the
// first time it is hovered or focused the title moves to data-tip (the browser would otherwise draw its
// own), and the text stays available to screen readers as the element's name when it has none.
const TIP = (() => {
  const el = document.createElement("div"); el.className = "xtip"; el.setAttribute("role", "tooltip"); el.id = "xtip"; document.body.append(el);
  let target = null, timer = 0, last = 0;
  const take = (n) => {
    if (n.hasAttribute("title")) {
      const t = n.getAttribute("title"); n.removeAttribute("title");
      if (t) { n.dataset.tip = t; if (!n.getAttribute("aria-label") && !n.textContent.trim() && !n.getAttribute("aria-labelledby")) n.setAttribute("aria-label", t); }
    }
    return n.dataset.tip || "";
  };
  const place = (n) => {
    const r = n.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight, vw = innerWidth, vh = innerHeight;
    const below = r.bottom + 8 + h <= vh - 6 || r.top - 8 - h < 6;
    el.style.left = Math.round(Math.max(6, Math.min(vw - w - 6, r.left + r.width / 2 - w / 2))) + "px";
    el.style.top = Math.round(below ? r.bottom + 8 : r.top - 8 - h) + "px";
    el.style.setProperty("--ty", below ? "4px" : "-4px");
  };
  const show = (n) => {
    const text = take(n); if (!text || !n.isConnected) return;
    target = n; el.textContent = text; place(n);
    n.setAttribute("aria-describedby", "xtip");
    el.classList.add("on");
  };
  const hide = () => {
    clearTimeout(timer); timer = 0;
    if (target) { target.removeAttribute("aria-describedby"); last = Date.now(); }
    target = null; el.classList.remove("on");
  };
  const arm = (n, now) => {
    clearTimeout(timer);
    // After one tooltip was just shown the next ones come at once, so moving along a row of buttons does not wait each time.
    const wait = now ? 0 : Date.now() - last < 600 ? 40 : 380;
    timer = setTimeout(() => show(n), wait);
  };
  document.addEventListener("pointerover", (e) => {
    if (e.pointerType === "touch") return;
    const n = e.target.closest?.("[title], [data-tip]");
    if (!n || n === target) return;
    if (target) hide();
    if (n.closest("[data-notip]")) { take(n); return; }
    take(n);   // strip the native title now, before the browser's own delay runs out
    if (n.dataset.tip) arm(n);
  }, true);
  document.addEventListener("pointerout", (e) => {
    const n = e.target.closest?.("[data-tip]");
    if (n && !n.contains(e.relatedTarget)) hide();
  }, true);
  document.addEventListener("focusin", (e) => {
    const n = e.target.closest?.("[title], [data-tip]");
    if (n && e.target.matches?.(":focus-visible")) { take(n); if (n.dataset.tip) arm(n, true); }
  });
  document.addEventListener("focusout", hide);
  for (const t of ["pointerdown", "keydown", "wheel", "contextmenu"]) document.addEventListener(t, hide, { capture: true, passive: true });
  addEventListener("scroll", hide, { capture: true, passive: true });
  addEventListener("blur", hide);
  // A title that changes while its tooltip is open (the theme button, a copied tick) updates in place.
  new MutationObserver((records) => { for (const r of records) if (r.target === target && r.attributeName === "title") { const t = take(target); if (t) { el.textContent = t; place(target); } else hide(); } })
    .observe(document.body, { subtree: true, attributes: true, attributeFilter: ["title"] });
  return { hide };
})();
enhanceWidgets();
// Selects drawn later (the machine menu on Limits, the metric menu on Models, the "move to" menu in Threads)
new MutationObserver((records) => { for (const r of records) for (const n of r.addedNodes) if (n.nodeType === 1) { if (n.matches?.("select")) enhanceSelect(n); else enhanceWidgets(n); } }).observe(document.body, { childList: true, subtree: true });

// ---- live updates -----------------------------------------------------------------
// One EventSource: the server says when the snapshots or the thread list changed, and the page
// reloads just that. A new message in the open thread is appended, and followed when you are at
// the bottom. If the connection drops the browser reconnects by itself, and the timers below
// keep the page current in the meantime.
function liveThread() {
  const t = state.thr, dt = t.detail, id = t.sel, conv = $("tconv");
  if (!dt || dt.error || !conv || !id || state.view !== "threads" || t.moreBusy || dt.messages.length < dt.total) return;
  get(`/api/threads/show?id=${encodeURIComponent(id)}&offset=${dt.messages.length}&limit=250&fresh=1`).then((r) => {
    if (t.sel !== id || t.detail !== dt || !r.messages?.length) return;
    const sc = $("tscroll"), follow = sc && sc.scrollHeight - sc.scrollTop - sc.clientHeight < 160;
    dt.messages.push(...r.messages); dt.total = r.total;
    const box = document.createElement("template");
    box.innerHTML = conversationHTML(r.messages);
    [...box.content.children].slice(0, 14).forEach((n) => n.classList.add("fresh"));
    const old = $("ctail"); old.before(box.content); old.outerHTML = tailHTML(dt);
    progress(); watchConvTail(); $("tdetail")?._edges?.();
    if (follow) requestAnimationFrame(() => sc.scrollTo({ top: sc.scrollHeight, behavior: reduced() ? "auto" : "smooth" }));
  }).catch(() => {});
}
if (typeof EventSource === "function") {
  const es = new EventSource("/api/events");
  es.addEventListener("usage", () => { if (state.view === "usage") loadUsage().catch(() => {}); else if (state.view === "models") loadModels().catch(() => {}); else state.staleUsage = true; });
  es.addEventListener("threads", () => { if (state.view === "threads" && !thrBusy && !state.thr.q.trim()) loadThreads(true).then(liveThread).catch(() => {}); });
  es.addEventListener("limits", () => { if (state.view === "limits") loadLimits().catch(() => {}); });
}

// ---- currency -------------------------------------------------------------------
// Prices are USD underneath. The select re-renders the page in another currency using
// the latest rate the server has (hourly refresh; the source publishes daily).
async function loadRates() {
  try {
    const r = await fetch("/api/rates");
    state.fx = r.ok ? await r.json() : null;
  } catch { state.fx = null; }
  fxNote();
}
function fxNote() {
  const sel = $("cur"); if (!sel) return;
  const rate = state.fx?.rates?.[state.cur];
  sel.classList.toggle("on", state.cur !== "USD");
  if (state.cur === "USD") sel.title = "Show prices in another currency";
  else if (!rate) sel.title = `No ${state.cur} rate available yet, showing US dollars`;
  else sel.title = `1 USD = ${CURRENCIES[state.cur][0]}${rate.toLocaleString(CURRENCIES[state.cur][1], { maximumFractionDigits: 2 })} \u00b7 ${state.fx.source}, ${new Date(state.fx.asOf).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}${state.fx.stale ? " (saved copy, offline)" : ""}`;
}
$("cur").innerHTML = Object.keys(CURRENCIES).map((c) => `<option value="${c}">${c}</option>`).join("");
if (!CURRENCIES[state.cur]) state.cur = "USD";
$("cur").value = state.cur;
// Threads shows no prices, so a new currency or rate must not redraw it (that would drop its scroll).
const repriced = () => { if (state.view !== "threads") render(); };
$("cur").addEventListener("change", async (e) => {
  state.cur = e.target.value; store.setItem("usage.cur", state.cur);
  if (state.cur !== "USD" && !state.fx) await loadRates();
  fxNote(); repriced();
});
if (state.cur !== "USD") loadRates().then(repriced);
setInterval(() => { if (state.cur !== "USD" && !document.hidden) loadRates().then(repriced); }, 30 * 60 * 1000);

new ResizeObserver(() => placeCustom()).observe(document.querySelector("header.top"));
$("main").addEventListener("click", (e) => {
  const btn = e.target.closest(".via-btn"); if (!btn) return;
  const open = btn.getAttribute("aria-expanded") !== "true", agent = btn.dataset.via;
  btn.setAttribute("aria-expanded", String(open));
  btn.nextElementSibling?.classList.toggle("open", open);
  open ? state.viaOpen.add(agent) : state.viaOpen.delete(agent);
  store.setItem("usage.viaOpen", JSON.stringify([...state.viaOpen]));
});
fetchIcons("/api/icons");
setView(state.view);
</script>
</body>
</html>
