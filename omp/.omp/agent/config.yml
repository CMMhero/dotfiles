  textSizing: true
  titleState: true
  tight: false
  imeSafeCursor: false
extendedContext: false
hideThinkingBlock: true
autolearn:
  enabled: false
completion:
  notify: "off"
ask:
  notify: "off"
display:
  subagentLivePreview: false
  showTokenUsage: false
  showTurnTime: true