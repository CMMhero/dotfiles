setupVersion: 2
modelRoles:
  default: commandcode/deepseek/deepseek-v4.1-flash-fast
theme:
  dark: dark-catppuccin
  light: light-catppuccin
symbolPreset: nerd
colorBlindMode: false
composer:
  shape: field
  tokenRate: true
