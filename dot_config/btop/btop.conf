# btop — starter config (CMM)
# Installed via winget (aristocratos.btop4win). Landed at ~/.config/btop/btop.conf.
# NOTE: this box didn't have a live btop.conf yet, so this is a themed starting
# point — tweak to taste and `chezmoi re-add` to keep it synced.

# Toggle showing box borders around the boxes.
theme_background = true

# Colorscheme. 0 = default ("Default"), 1 = "Default", 2 = "TTY", 3 = "dracula",
# 4 = "nord", 5 = "gray", 6 = "gruvbox", 7 = "catppuccin", 8 = "tokyo-night"
color_theme = "catppuccin"

# Processes shown: auto, tree, or a blank space for just the list.
proc_tree = true

# Base 10 for sizes (powers of 1000), otherwise binary (KB, MB, GB vs KiB, MiB, GiB)
base_10_sizes = true

# Update time in milliseconds, recommended between 500 and 5000.
update_ms = 2000

# Rounded corners on the boxes
rounded_corners = true

# Default box layout: right panel (mem, proc) then bottom (net, proc, disks) 
# then left panel (cpu, mem). Order = right, bottom, left.
v=#############,##########,##########