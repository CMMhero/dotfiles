# lazygit configuration
gui:
  # Side-by-side diff in the main panel, matching delta's side-by-side = true
  # in ~/.gitconfig.
  splitDiff: true

git:
  # Ignore whitespace-only changes in the diff view.
  ignoreWhitespaceInDiffView: false
  # Number of context lines around a change.
  diffContextSize: 3
  # lazygit calls this "hunk mode" internally and applies it to the staging view
  # as well as the diff view; it makes line selection act on whole hunks rather
  # than individual lines.
  useHunkModeInDiffView: true